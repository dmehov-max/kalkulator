<title>Корект онлайн оферта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Open+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: brand header strip, route hero, then two columns — details left, sticky price card right; one column on phones. */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --ink: #232e33;
  --muted: #5d6c73;
  --line: #dde3e6;
  --brand: #c8191f;
  --brand-ink: #ffffff;
  --slate: #37474f;
  --slate-ink: #ffffff;
  --soft: #fbecec;
  --ok: #1e7a46;
  --ok-soft: #e5f3ea;
  --f-display: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Open Sans", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171a; --surface: #1a2226; --ink: #e7ecee; --muted: #9aa9b0; --line: #2c373c;
    --brand: #ec4a50; --brand-ink: #ffffff; --slate: #0b1013; --slate-ink: #e7ecee;
    --soft: #2c1d1f; --ok: #5ccf8b; --ok-soft: #17291f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171a; --surface: #1a2226; --ink: #e7ecee; --muted: #9aa9b0; --line: #2c373c;
  --brand: #ec4a50; --brand-ink: #ffffff; --slate: #0b1013; --slate-ink: #e7ecee;
  --soft: #2c1d1f; --ok: #5ccf8b; --ok-soft: #17291f; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h2 { font-size: 1.45rem; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

/* Header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
.logo { background: #fff; border-radius: 6px; padding: 4px 6px; display: inline-flex; }
.logo img { height: 38px; width: auto; display: block; }
.top-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.offer-no { font-size: .8rem; color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; font-size: .8rem; font-weight: 700; }
.lang button[aria-pressed="true"] { background: var(--slate); color: var(--slate-ink); }

/* Hero */
.hero { background: var(--slate); color: var(--slate-ink); }
.hero .wrap { padding-block: 34px 30px; display: grid; gap: 22px; }
.hero .greet { opacity: .8; font-size: 1rem; }
.route { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 14px; }
.route .city { font-family: var(--f-display); font-size: clamp(1.8rem, 5.2vw, 3.2rem); line-height: 1.05; text-transform: uppercase; }
.route .country { font-size: .85rem; opacity: .75; margin-top: 4px; }
.route .to { text-align: right; }
.route .mid { display: grid; justify-items: center; gap: 6px; min-width: 90px; }
.route svg { width: clamp(90px, 18vw, 220px); height: 26px; display: block; }
.route .km { font-size: .78rem; opacity: .85; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid color-mix(in srgb, var(--slate-ink) 28%, transparent); border-radius: 999px; padding: 4px 12px; font-size: .82rem; }
.chip b { font-weight: 700; }
.chip.example { background: #fbbc04; color: #2a2100; border-color: #fbbc04; font-weight: 700; }

/* Offer conditions band, right under the hero */
.cond { background: var(--surface); border-bottom: 1px solid var(--line); }
.cond .wrap { padding-block: 20px; display: grid; gap: 12px; }
.cond ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 24px; }
.cond li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; font-size: .92rem; }
.cond .ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--brand); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: .78rem; margin-top: 1px; }
.cond b { display: block; }
.cond .s { color: var(--muted); font-size: .86rem; }
.avatar img, .avatar svg { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.avatar { overflow: hidden; }

/* Main grid */
main .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; padding-block: 28px 48px; align-items: start; }
@media (max-width: 880px) { main .wrap { grid-template-columns: minmax(0,1fr); } }
.col { display: grid; gap: 26px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 16px; min-width: 0; }
.panel > header { display: grid; gap: 4px; }
.panel > header p { color: var(--muted); font-size: .92rem; }

/* Facts */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.fact { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.fact .v { font-weight: 600; overflow-wrap: anywhere; }
.fact .s { font-size: .82rem; color: var(--muted); }

/* Inventory */
.invwrap { overflow-x: auto; }
.inv { width: 100%; border-collapse: collapse; font-size: .92rem; }
.inv th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 2px solid var(--line); }
.inv td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.inv .n { text-align: right; width: 64px; }
.inv .note { color: var(--muted); font-size: .86rem; }
.inv tfoot td { font-weight: 700; border-bottom: 0; }

/* Coordinator */
.coord { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 16px; align-items: center; }
.avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.4rem; }
.coord .name { font-weight: 700; font-size: 1.05rem; }
.contact-rows { display: grid; gap: 6px; margin-top: 4px; }
.contact-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .92rem; }
.contact-row .lbl { color: var(--muted); min-width: 74px; }
.copy { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; font-size: .72rem; padding: 2px 8px; }

/* Included */
.incl { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 22px; }
.incl li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; }
.incl .tick { width: 22px; height: 22px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; font-size: .8rem; font-weight: 700; margin-top: 1px; }
.incl b { display: block; }
.incl span { color: var(--muted); font-size: .88rem; }

/* Add-ons */
.addons { display: grid; gap: 10px; }
.addon { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.addon:has(input:checked) { border-color: var(--brand); background: var(--soft); }
.addon input { width: 18px; height: 18px; accent-color: var(--brand); margin: 0; }
.addon .t { font-weight: 600; }
.addon .d { color: var(--muted); font-size: .85rem; }
.addon .p { font-weight: 700; white-space: nowrap; }

/* Timeline */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 14px; position: relative; padding-bottom: 18px; }
.steps li::before { counter-increment: s; content: counter(s); width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--brand); color: var(--brand); display: grid; place-items: center; font-weight: 700; background: var(--surface); position: relative; z-index: 1; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.steps .when { font-size: .82rem; color: var(--brand); font-weight: 700; }
.steps .what { font-weight: 600; }
.steps .how { color: var(--muted); font-size: .88rem; }

/* Info */
.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.info h3 { font-size: 1.05rem; margin-bottom: 6px; }
.info ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: .9rem; display: grid; gap: 4px; }
.link { color: var(--brand); font-weight: 600; }

/* Trust */
.trust { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.trust div { border-left: 3px solid var(--brand); padding-left: 12px; }
.trust .big { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.1; }
.trust .small { color: var(--muted); font-size: .84rem; }

/* Price card */
.price { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: 0 10px 30px -18px rgba(20, 30, 35, .45); }
.price .head { background: var(--brand); color: var(--brand-ink); padding: 16px 20px; display: grid; gap: 2px; }
.price .head .eyebrow { color: color-mix(in srgb, var(--brand-ink) 80%, transparent); }
.price .total { font-family: var(--f-display); font-size: 2.3rem; line-height: 1.05; }
.price .vatnote { font-size: .82rem; opacity: .9; }
.price .body { padding: 16px 20px 20px; display: grid; gap: 14px; }
.lines { display: grid; gap: 8px; font-size: .9rem; }
.line { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; }
.line .q { color: var(--muted); font-size: .8rem; display: block; }
.line.sum { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
.line.grand { font-size: 1.05rem; font-weight: 700; }
.line.addonline, .pincl .addonline { color: var(--brand); }
.pincl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pincl li { display: grid; grid-template-columns: 18px minmax(0,1fr); column-gap: 8px; }
.pincl li::before { content: "✓"; color: var(--ok); font-weight: 700; grid-row: span 2; }
.pincl .q { color: var(--muted); font-size: .8rem; }
.bap { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--ink); text-decoration: none; }
.bap:hover { border-color: var(--brand); }
.bap .logo img { height: 44px; width: auto; }
.bap b { display: block; }
.bap .small { color: var(--muted); font-size: .84rem; }
@media (max-width: 520px) { .bap { grid-template-columns: minmax(0,1fr); } }
.stagebox { display: grid; gap: 10px; }
.track { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.track span { border-radius: 6px; padding: 6px 8px; font-size: .78rem; font-weight: 700; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.track span.on { background: var(--soft); color: var(--brand); border-color: var(--brand); }
.track span.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.why { font-size: .84rem; color: var(--muted); }
.why b { color: var(--ink); }
.stagepick::before { content: attr(aria-label); align-self: center; font-size: .72rem; color: var(--muted); padding: 0 8px; }
.act .field { display: grid; gap: 6px; font-size: .9rem; }
.act input[type="date"], .act select { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; background: var(--bg); color: var(--ink); max-width: 100%; }
.act .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.pay { background: var(--bg); border-radius: 8px; padding: 12px; display: grid; gap: 6px; font-size: .86rem; }
.pay .line { font-size: .86rem; }
.valid { font-size: .84rem; color: var(--muted); }
.valid b { color: var(--ink); }
.btn { display: block; width: 100%; border-radius: 8px; padding: 12px 14px; font-weight: 700; border: 1px solid transparent; text-align: center; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.promise { font-size: .82rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; }

/* Accept / change panel */
.act { border: 2px solid var(--brand); }
.act textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; background: var(--bg); color: var(--ink); resize: vertical; }
.act label.chk { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; }
.act label.chk input { margin-top: 4px; accent-color: var(--brand); }
.msg { background: var(--bg); border-radius: 8px; padding: 12px; font-family: var(--f-mono); font-size: .82rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.done { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 12px; font-weight: 600; }

footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .85rem; }
footer .sig { font-style: italic; }

@media (prefers-reduced-motion: no-preference) {
  .route .truck { animation: drive 3.2s ease-in-out infinite alternate; }
  @keyframes drive { from { transform: translateX(0); } to { transform: translateX(150px); } }
}
@media (max-width: 520px) {
  .route { grid-template-columns: minmax(0,1fr); }
  .route .to { text-align: left; }
  .route .mid { justify-items: start; }
  .panel { padding: 18px; }
}
</style>

/* ===================== ЛОГИКА ===================== */
let lang = "bg";
try { lang = localStorage.getItem("korekt-lang") || "bg"; } catch (e) {}
const picked = new Set();
const $ = id => document.getElementById(id);
const L = v => (v && typeof v === "object" && "bg" in v) ? v[lang] : v;
const eur = n => new Intl.NumberFormat(lang === "bg" ? "bg-BG" : "en-GB", { style: "currency", currency: "EUR", minimumFractionDigits: 2 }).format(n);
const date = s => new Date(s + "T12:00:00").toLocaleDateString(lang === "bg" ? "bg-BG" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const isIntl = () => (OFFER.kind || "international") === "international";
const isInd = () => isIntl() && OFFER.stage === "indicative";
function renderInventory() {
  const t = T[lang], inv = OFFER.inventory || [];
  $("invPanel").hidden = !inv.length;
  if (!inv.length) return;
  const total = inv.reduce((a, r) => a + (+r.qty || 0), 0);
  $("inv").innerHTML = `<thead><tr><th>${t.invItem}</th><th class="n">${t.invQty}</th><th>${t.invNote}</th></tr></thead><tbody>` +
    inv.map(r => `<tr><td>${esc(L(r.item))}</td><td class="n mono">${esc(r.qty)}</td><td class="note">${esc(L(r.note))}</td></tr>`).join("") +
    `</tbody><tfoot><tr><td>${t.invTotal}</td><td class="n mono">${total}</td><td></td></tr></tfoot>`;
}
function totals() {
  const base = OFFER.lines.reduce((a, l) => a + l.amount, 0);
  const extra = OFFER.addons.filter(a => picked.has(a.id)).reduce((a, l) => a + l.amount, 0);
  const net = Math.round((base + extra) * 100) / 100;
  const vat = Math.round(net * OFFER.vatRate * 100) / 100;
  return { net, vat, gross: Math.round((net + vat) * 100) / 100 };
}

function renderPrice() {
  const t = T[lang], s = totals(), ind = isInd(), intl = isIntl();
  $("h-price").textContent = !intl ? t.priceDom : ind ? t.priceInd : t.priceFix;
  $("grandTop").textContent = (ind ? "≈ " : "") + eur(s.net);
  $("vatNote").textContent = t.vatLine(eur(s.vat));
  $("stageBox").innerHTML = !intl ? `<p class="why">${t.whyDom}</p>` : `<div class="track"><span class="${ind ? "on" : "done"}">${ind ? "1" : "✓"} · ${t.track1}</span><span class="${ind ? "" : "on"}">2 · ${t.track2}</span></div>` +
    `<p class="why">${ind ? t.whyInd : t.whyFix(date(OFFER.loadDate))}</p>`;
  $("btnAccept").textContent = ind ? t.askDates : t.accept;
  $("pay").parentElement.querySelector(".eyebrow").hidden = false;
  // Само крайна цена: показваме какво включва, без суми по редове
  const items = OFFER.lines.map(l => `<li>${esc(l[lang])}<span class="q">${esc(L(l.q))}</span></li>`);
  OFFER.addons.filter(a => picked.has(a.id)).forEach(a => items.push(`<li class="addonline">${esc(a[lang])}</li>`));
  $("lines").innerHTML = `<span class="eyebrow">${t.priceIncl}</span><ul class="pincl">${items.join("")}</ul>`;
  if (ind) { $("pay").innerHTML = `<span>${t.payAfter}</span>`; return; }
  if (!OFFER.payments.length) { $("pay").innerHTML = `<span>${t.payDefault}</span>`; return; }
  let left = s.gross;
  $("pay").innerHTML = OFFER.payments.map((p, i) => {
    const amt = i === OFFER.payments.length - 1 ? left : Math.round(s.gross * p.share * 100) / 100;
    left = Math.round((left - amt) * 100) / 100;
    return `<div class="line"><span>${esc(p[lang])} · ${Math.round(p.share * 100)}%</span><span class="mono">${eur(amt)}</span></div>`;
  }).join("");
}

function render() {
  const langs = OFFER.langs || ["bg", "en"];
  if (!langs.includes(lang)) lang = langs[0];
  document.querySelector(".lang:not(.stagepick)").hidden = langs.length < 2;
  const t = T[lang], o = OFFER;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("offerId").textContent = o.id;
  const ind = isInd(), intl = isIntl();
  $("greet").textContent = !intl ? t.greetDom(L(o.client)) : ind ? t.greetInd(L(o.client)) : t.greet(L(o.client));
  $("stagePick").hidden = !o.example || !intl;
  $("stagePick").setAttribute("aria-label", t.preview);
  document.querySelectorAll("[data-stage]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.stage === o.stage)));
  $("fromCity").textContent = L(o.from.city); $("fromCountry").textContent = L(o.from.country);
  $("toCity").textContent = L(o.to.city); $("toCountry").textContent = L(o.to.country);
  $("km").textContent = o.km ? `≈ ${o.km.toLocaleString(lang === "bg" ? "bg-BG" : "en-GB")} km` : L(o.service);
  $("chips").innerHTML = (o.example ? `<span class="chip example">${t.example}</span>` : "") +
    (intl ? `<span class="chip"><b>${ind ? t.stageInd : t.stageFix}</b></span>` : "") +
    (ind
      ? `<span class="chip">${t.period}: <b>${esc(L(o.preferredPeriod))}</b></span>`
      : (o.loadDate ? `<span class="chip">${t.load}: <b>${date(o.loadDate)}</b></span>` : "") + (L(o.deliveryWindow) ? `<span class="chip">${t.delivery}: <b>${esc(L(o.deliveryWindow))}</b></span>` : "")) +
    (o.volume ? `<span class="chip">${t.volume}: <b>${o.volume} m³${o.weightKg ? " / " + o.weightKg + " kg" : ""}</b></span>` : "") +
    `<span class="chip">${esc(L(o.service))}</span>`;
  const facts = [
    [t.fFrom, `${L(o.from.city)}, ${L(o.from.country)}`, L(o.from.addr)],
    [t.fTo, `${L(o.to.city)}, ${L(o.to.country)}`, L(o.to.addr)],
    [intl ? t.fLoad : t.fDate, ind || !o.loadDate ? t.tbd : date(o.loadDate), ind ? t.wished(L(o.preferredPeriod)) : ""],
    [t.fDel, ind ? t.tbd : L(o.deliveryWindow), ""],
    [t.fVol, o.volume ? `${o.volume} m³${o.weightKg ? " · " + o.weightKg + " kg" : ""}` : "", ""],
    [t.fSvc, L(o.service), L(o.vehicle)],
    [t.fDist, o.km ? `≈ ${o.km} km` : "", ""]
  ].filter(f => f[1]);
  $("facts").innerHTML = facts.map(([k, v, s]) => `<div class="fact"><span class="eyebrow">${k}</span><span class="v">${esc(v)}</span>${s ? `<span class="s">${esc(s)}</span>` : ""}</div>`).join("");
  const c = o.coordinator;
  const sc = ind ? t.condInd : t.condFix;
  $("cond").innerHTML = (intl ? `<li><span class="ic">€</span><div><b>${sc[0]}</b><span class="s">${sc[1]}</span></div></li>` : "") + o.conditions.map(x => `<li><span class="ic">!</span><div><b>${esc(L(x.b))}</b><span class="s">${esc(L(x.s))}</span></div></li>`).join("");
  $("coordInit").innerHTML = c.photo
    ? `<img src="${esc(c.photo)}" alt="${esc(L(c.name))}">`
    : `<svg viewBox="0 0 56 56" role="img" aria-label="${esc(L(c.name))}"><rect width="56" height="56" fill="#cfd8dc"/><circle cx="28" cy="22" r="10" fill="#90a4ae"/><path d="M8 56c2-12 10-18 20-18s18 6 20 18z" fill="#90a4ae"/></svg>`;
$("coordName").textContent = L(c.name); $("coordRole").textContent = L(c.role);
  const contacts = [[t.phone, c.phone], [t.office, c.phone2], [t.email, c.email]].filter(x => x[1]);
  $("coordContacts").innerHTML = contacts.map(([k, v], i) => `<div class="contact-row"><span class="lbl">${k}</span><span class="mono" id="ct-${i}">${esc(v)}</span><button type="button" class="copy" data-copy="${esc(v)}">${t.copy}</button></div>`).join("");
  $("incl").innerHTML = t.incl.map(([b, s]) => `<li><span class="tick">✓</span><div><b>${b}</b><span>${s}</span></div></li>`).join("");
  $("addons").innerHTML = o.addons.map(a => `<label class="addon" for="${a.id}"><input type="checkbox" id="${a.id}" ${picked.has(a.id) ? "checked" : ""}><span><span class="t">${esc(a[lang])}</span><br><span class="d">${esc(L(a.d))}</span></span></label>`).join("");
  renderInventory();
  $("steps").innerHTML = (intl ? t.steps : t.stepsDom).map(([w, h, d]) => `<li><div><div class="when">${w}</div><div class="what">${h}</div><div class="how">${d}</div></div></li>`).join("");
  $("info").innerHTML = t.info.map(([h, items]) => `<div><h3>${h}</h3><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("");
  $("trust").innerHTML = t.trust.map(([b, s]) => `<div><div class="big">${b}</div><div class="small">${s}</div></div>`).join("");
  const until = new Date(o.issued + "T12:00:00"); until.setDate(until.getDate() + o.validDays);
  $("valid").innerHTML = t.valid(date(until.toISOString().slice(0, 10)));
  renderPrice();
  if (!$("actPanel").hidden) openAct(currentAct, true);
}

let currentAct = null;
function openAct(kind, keep) {
  const t = T[lang], p = $("actPanel"), s = totals();
  currentAct = kind;
  const title = { accept: t.actAccept, change: t.actChange, ask: t.actAsk, dates: t.actDates }[kind];
  const lead = { accept: t.actAcceptLead, change: t.actChangeLead, ask: t.actAskLead, dates: t.actDatesLead }[kind];
  if (kind === "dates") {
    const pd = keep && $("act-date") ? $("act-date").value : "", pf = keep && $("act-flex") ? $("act-flex").value : "1", pn = keep && $("act-note") ? $("act-note").value : "";
    p.innerHTML = `<header><span class="eyebrow">${OFFER.id}</span><h2>${title}</h2><p>${lead}</p></header>` +
      `<div class="fields"><label class="field" for="act-date">${t.fDate}<input type="date" id="act-date" min="${OFFER.issued}" value="${esc(pd)}"></label>` +
      `<label class="field" for="act-flex">${t.fFlex}<select id="act-flex">${t.flex.map((f, i) => `<option value="${i}" ${String(i) === pf ? "selected" : ""}>${f}</option>`).join("")}</select></label></div>` +
      `<label class="field" for="act-note">${t.fNote}<textarea id="act-note">${esc(pn)}</textarea></label>` +
      `<div class="btn-row"><button type="button" class="btn primary" id="act-send">${t.send}</button><button type="button" class="btn ghost" id="act-cancel">${t.cancel}</button></div><div id="act-result"></div>`;
    p.hidden = false;
    if (!keep) p.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    $("act-cancel").onclick = () => { p.hidden = true; currentAct = null; };
    $("act-send").onclick = () => {
      if (!$("act-date").value) { $("act-date").focus(); return; }
      $("act-result").innerHTML = `<div class="done">${t.sentDates}</div>` + (OFFER.example ? `<p style="color:var(--muted);font-size:.84rem;margin-top:8px">${t.demoNote}</p>` : "");
      $("act-send").disabled = true;
    };
    return;
  }
  const prev = keep && $("act-text") ? $("act-text").value : "";
  const addons = OFFER.addons.filter(a => picked.has(a.id)).map(a => a[lang]).join(", ") || t.none;
  p.innerHTML = `<header><span class="eyebrow">${OFFER.id}</span><h2>${title}</h2><p>${lead}</p></header>` +
    (kind === "accept"
      ? `<div class="msg">${esc(t.grand)}: ${eur(s.gross)}\n${esc(t.selected)}: ${esc(addons)}</div><label class="chk" for="act-agree"><input type="checkbox" id="act-agree"> <span>${t.agree} <a class="link" href="https://www.korekt-bg.com/obshti-usloviya-za-premestvane" target="_blank" rel="noopener">→</a></span></label>`
      : `<textarea id="act-text" placeholder="${esc(kind === "change" ? t.placeholderChange : t.placeholderAsk)}">${esc(prev)}</textarea>`) +
    `<div class="btn-row"><button type="button" class="btn primary" id="act-send">${t.send}</button><button type="button" class="btn ghost" id="act-cancel">${t.cancel}</button></div><div id="act-result"></div>`;
  p.hidden = false;
  if (!keep) p.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  $("act-cancel").onclick = () => { p.hidden = true; currentAct = null; };
  $("act-send").onclick = () => {
    if (kind === "accept" && !$("act-agree").checked) { $("act-agree").focus(); $("act-agree").closest("label").style.color = "var(--brand)"; return; }
    if (kind !== "accept" && !$("act-text").value.trim()) { $("act-text").focus(); return; }
    $("act-result").innerHTML = `<div class="done">${kind === "accept" ? t.sentAccept : t.sentOther}</div>` + (OFFER.example ? `<p style="color:var(--muted);font-size:.84rem;margin-top:8px">${t.demoNote}</p>` : "");
    $("act-send").disabled = true;
  };
}

document.addEventListener("change", e => {
  if (e.target.matches(".addon input")) { e.target.checked ? picked.add(e.target.id) : picked.delete(e.target.id); renderPrice(); if (currentAct === "accept") openAct("accept", true); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (b) { lang = b.dataset.lang; try { localStorage.setItem("korekt-lang", lang); } catch (err) {} render(); return; }
  const st = e.target.closest("[data-stage]");
  if (st) { OFFER.stage = st.dataset.stage; $("actPanel").hidden = true; currentAct = null; render(); return; }
  const c = e.target.closest("[data-copy]");
  if (c) {
    const done = () => { c.textContent = T[lang].copied; setTimeout(() => c.textContent = T[lang].copy, 1400); };
    navigator.clipboard?.writeText(c.dataset.copy).then(done).catch(() => { const r = document.createRange(); r.selectNodeContents(c.previousElementSibling); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
  }
});
$("btnAccept").onclick = () => openAct(isInd() ? "dates" : "accept");
$("btnChange").onclick = () => openAct("change");
$("btnAsk").onclick = () => openAct("ask");
// Преглед в админ панела: панелът праща нови данни, без да презарежда страницата
if (window.KOREKT_PREVIEW) {
  window.addEventListener("message", e => {
    const d = e.data;
    if (!d || d.type !== "korekt-offer" || !d.offer) return;
    Object.keys(OFFER).forEach(k => delete OFFER[k]);
    Object.assign(OFFER, d.offer);
    picked.clear(); $("actPanel").hidden = true; currentAct = null;
    render();
  });
  parent.postMessage({ type: "korekt-ready" }, "*");
}
render();
</script>
