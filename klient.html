 * Не е AI извикване (нужен би бил платен API извън браузъра) — работи изцяло
 * локално чрез съвпадение с каталога, толерантно към бройка отпред/отзад,

// Разговорни думи → вещ от каталога (поставен списък и гласовият асистент). Първото съвпадение печели.
const ITEM_SYNONYMS = [[/^(кашон\S*|кутия|кутии)$/, "boxM"], [/кашон\S* (с|за) книги|книги/, "books"], [/спалн/, "bedDouble"], [/персон и половина|приста/, "bedDouble"], [/телевизор|^тв$|плазма/, "tvstand"], [/секци/, "wallUnit"], [/^печка$|готварск/, "stove"], [/фурн/, "ovenBuiltIn"], [/микровълн/, "microwave"], [/трапезн\S* маса|маса\S* за хранене|^маса$|^маси$/, "table"], [/холна маса|масичк/, "tableSmall"], [/плъзг/, "wardrobe4"], [/етажерк|библиотек|рафт/, "shelf"], [/скрин|комод/, "dresser"], [/нощн/, "nightstand"], [/огледал|картин/, "art"], [/сакси|цвет|растени/, "plant"], [/колел|велосипед/, "bike"], [/климатик/, "ac"], [/компютър|монитор|лаптоп/, "computer"], [/ъглов/, "sofaL"], [/матра/, "mattress"], [/фотьойл|кресло/, "armchair"], [/куфар|сак$|сакове/, "suitcase"], [/чувал/, "clothesBag"]];
// „трикрилен“, „3 крилен“, „три крила“ → „3-крилен“; „тройка“, „триместен“ → „3-местен“
function normalizeItemText(text) {
  const NUM = {
    едно: 1,
    един: 1,
    дву: 2,
    две: 2,
    два: 2,
    три: 3,
    четири: 4

  let t = " " + String(text || "").toLowerCase().replace(/ё/g, "е") + " ";
  t = t.replace(/(едно|дву|три|четири)\s*-?\s*крил\S*/g, (m, w) => `${NUM[w]}-крилен`).replace(/(\d)\s*-?\s*(?:крил\S*|врат\S*)/g, "$1-крилен").replace(/с (две|три|четири) (?:крила|врати)/g, (m, w) => `${NUM[w]}-крилен`).replace(/(дву|три)\s*-?\s*мест\S*/g, (m, w) => `${NUM[w]}-местен`).replace(/(\d)\s*-?\s*мест\S*/g, "$1-местен").replace(/ двойка(?= )/g, " 2-местен").replace(/ тройка(?= )/g, " 3-местен"); // \b не работи с кирилица
  return t.replace(/\s+/g, " ").trim();
}
function parseItemListLine(line) {
  const raw = String(line || "").trim();
  if (!raw) return null;
  // „3-крилен гардероб“: числото е част от името, не е бройка
  if (/^\d\s*-\s*(крил|мест)/i.test(normalizeItemText(raw))) return {
    raw,
    qty: 1,
    text: raw
  };
  // бройка отпред: "2x диван", "2 х диван", "2 дивана", "2. диван"
  // разделителят се приема САМО ако е самостоятелен (следван от интервал/край) —
  // иначе "1 хладилник" би изял буквата "х" от началото на "хладилник"
  let m = raw.match(/^(\d+)\s*(?:[xх×.](?=\s|$))?\s*(.+)$/i);
  if (m) return {
    raw,
    qty: Math.max(1, parseInt(m[1], 10)),
    text: m[2].trim()
  };
  // бройка отзад: "диван - 2 бр", "диван х2", "диван (2)"
  m = raw.match(/^(.+?)[\s\-–—x×хX]*\(?\s*(\d+)\s*(бр\.?|броя|х|x)?\)?\s*$/i);
  if (m && m[2]) return {
    raw,
    qty: Math.max(1, parseInt(m[2], 10)),
    text: m[1].trim()

    raw,
    qty: 1,
    text: raw

function matchCatalogItem(text) {
  const norm = normalizeItemText(text);
  const q = translitBG(norm);

    ...it,
    group: g.group

  // основа на думата: „гардероба“, „гардеробите“ → „гардероб“; „столове“ → „стол“
  const stem = w => w.length > 6 ? w.slice(0, w.length - 2) : w.length > 4 ? w.slice(0, w.length - 1) : w;
  const syn = ITEM_SYNONYMS.find(([re]) => re.test(norm));
  const scored = all.map(it => {
    const label = translitBG(it.label.toLowerCase());
    let score = 0;
    if (label === q) score = 100;else if (label.startsWith(q) || q.startsWith(label)) score = 80;else if (label.includes(q) || q.includes(label)) score = 60;else {
      // припокриване на думи — хваща разместен ред ("местен диван" vs "диван местен").
      // минимална дължина 3, инак къси думи ("с", "на") съвпадат тривиално навсякъде
      const qWords = q.split(/\s+/).filter(w => w.length >= 3);
      const lWords = label.split(/[\s/()]+/).filter(w => w.length >= 3);
      const same = (w, lw) => lw.includes(w) || w.includes(lw) || lw.startsWith(stem(w)) || w.startsWith(stem(lw));

    return {

// разпознава цял поставен списък (текст, ред на ред) — връща за всеки ред бройка,

function parseItemList(text) {
  // по ред, запетая и точка и запетая; още „X и Y“, „X + Y“ и „маса с 6 стола“ → отделни вещи
  const lines = String(text || "").split(/[\n,;+]+|\s+и\s+|\s+с(?:ъс)?\s+(?=\d)/i).map(l => l.replace(/^[\s•*–—-]+/, "").trim()).filter(Boolean);

    const parsed = parseItemListLine(line);
    if (!parsed) return null;
    const candidates = matchCatalogItem(parsed.text);

      ...parsed,
      candidates,
      chosenId: candidates[0]?.id || null

//   true  → всички бройки от вещта (обратна съвместимост)
//   число → само толкова бройки (напр. 4 бюра, но само 1 се разглобява)
//   false/липсва → нищо
const pickCount = (flag, cnt) => {
  if (flag === true) return cnt;
  const n = Number(flag);
  if (Number.isFinite(n) && n > 0) return Math.min(n, cnt);
  return 0;
};
const disHoursFor = (qty, dis, asm, factor) => {
  let d = 0,
    a = 0;
  for (const [id, cnt] of Object.entries(qty)) {
    const it = ITEM_INDEX[id];
    if (!it || !cnt) continue;
    if (it.dis) d += it.dis * pickCount(dis?.[id], cnt);
    if (it.asm) a += it.asm * pickCount(asm?.[id], cnt);
  }
  const k = factor || 1;
  return {
    dis: d * k,
    asm: a * k,
    total: (d + a) * k
  };
};

// метри твърда защита (велпапе / автопласт) — за чупливи повърхности
// protectReq вещите тръгват отметнати по подразбиране (когато отметката липсва изобщо —
// ?? хваща само undefined, не false), но вече не са заключени: колегата може да ги разотметне.
// selfPack: бройки, за които клиентът вече е опаковал вещта сам — приспадат се във всички случаи
const protectMetersFor = (qty, protect, selfPack) => Object.entries(qty).reduce((s, [id, cnt]) => {
  const it = ITEM_INDEX[id];
  if (!it?.protect || !cnt) return s;
  const flag = protect?.[id] ?? (it.protectReq ? true : false);
  const packed = pickCount(selfPack?.[id], cnt);
  const n = Math.max(0, pickCount(flag, cnt) - packed);
  return s + it.protect * n;
}, 0);

// метри стреч фолио: wrapReq (всяка мебел + техника) тръгва ОТМЕТНАТ по подразбиране (когато
// отметката липсва изобщо — ?? хваща само undefined, не false), но колегата може да го разотметне;
// останалите (ТВ, принтер, килим...) — само при отметка. "Опаковано от клиента" се приспада винаги.
const wrapDefault = it => it?.wrapReq ? true : false;
const wrapMetersFor = (qty, wrap, selfPack) => Object.entries(qty).reduce((s, [id, cnt]) => {
  const it = ITEM_INDEX[id];
  if (!it?.wrap || !cnt) return s;
  const packed = pickCount(selfPack?.[id], cnt);
  const n = Math.max(0, pickCount(wrap?.[id] ?? wrapDefault(it), cnt) - packed);
  return s + it.wrap * n;
}, 0);
const totalWeight = qty => Object.entries(qty).reduce((s, [id, cnt]) => s + (ITEM_INDEX[id]?.kg || 0) * cnt, 0);
const countKind = (qty, kind) => Object.entries(qty).reduce((s, [id, cnt]) => s + (ITEM_INDEX[id]?.kind === kind ? cnt : 0), 0);
// вещи без изрична категория (кашон/уред/едрогабаритно/дребно) — "обикновена мебел":
// гардероби, легла, маси и пр. Носят се по стълби също като уредите.
const FLOOR_FEE_KINDS = new Set(["box", "sack", "appliance", "appliance_heavy", "oversized", "small"]);
const countFurniture = qty => Object.entries(qty).reduce((s, [id, cnt]) => {
  const it = ITEM_INDEX[id];
  return s + (it && cnt > 0 && !FLOOR_FEE_KINDS.has(it.kind) ? cnt : 0);
}, 0);
// таксата "Стълби без асансьор" се смята НА БРОЙ (не на м³/кг) — тук е само за показване в
// каталога кой ред/€ на етаж важи за дадена вещ, за да е ясно защо напр. картина излиза
// евтина, а гардероб скъпо (виж бъга с калк №98 — 11 картини на цената на 11 гардероба)
const FLOOR_FEE_LABEL = {
  box: "кашон",
  sack: "кашон",
  appliance: "уред",
  appliance_heavy: "спец. уред",
  oversized: "едрогаб.",
  small: "дребна вещ"
};
const floorFeeRateFor = (it, p) => {
  if (!it) return 0;
  switch (it.kind) {
    case "box":
    case "sack":
      return n(p.boxPerFloor);
    case "appliance":
      return n(p.appliancePerFloor);
    case "appliance_heavy":
      return n(p.heavyAppliancePerFloor);
    // едрогабаритни (диван 3-ка, ъглов диван...) са си МЕБЕЛИ — просто не влизат в пътнически
    // асансьор. Не са "спец. уред" (хладилник side-by-side, Miele...) и не бива да носят
    // неговата по-висока ставка — само мебелната.
    case "oversized":
      return n(p.furniturePerFloor);
    case "small":
      return n(p.smallItemPerFloor);
    default:
      return n(p.furniturePerFloor);
  }
};
// pieces: вещ, която се носи на няколко отделни части (ъглов диван = 2) — по стълбите всяка
// част е отделно носене, затова таксата/времето се смятат на част, не на бройка
const piecesOf = it => it?.pieces || 1;
// бройки за таксата "Стълби", след като се извадят маркираните от служителя като
// "без такса качване" (s.floorFeeOff) — напр. вещи, оставени на партера, качени с кран
// през прозорец и пр. predicate избира кой "kind" (или "без категория" = мебел) да преброи
const netFloorQty = (qty, floorFeeOff, predicate) => Object.entries(qty).reduce((s, [id, cnt]) => {
  const it = ITEM_INDEX[id];
  if (!it || !cnt || !predicate(it)) return s;
  const off = pickCount(floorFeeOff?.[id], cnt);
  return s + Math.max(0, cnt - off) * piecesOf(it);
}, 0);

function haversineKm(a, b) {
  const R = 6371,
    toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat),
    dLng = toR(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
// нормализация: маха "кв.", "ж.к.", "с.", "гр.", регистър и излишни интервали
function normHood(x) {
  return String(x || "").toLowerCase().trim().replace(/^(кв\.?|ж\.?к\.?|жк|с\.?|гр\.?)\s+/i, "").replace(/\s+/g, " ");
}
function findHood(city, name) {
  const list = NEIGHBORHOODS[city];
  if (!list || !name) return null;
  const q = normHood(name);
  if (!q) return null;
  return list.find(x => normHood(x.name) === q) || list.find(x => normHood(x.name).startsWith(q)) || list.find(x => normHood(x.name).includes(q)) || null;
}
function cityCenter(city) {
  const list = NEIGHBORHOODS[city];
  if (list) return list.find(x => x.name === "Център") || list[0];
  return typeof CITIES !== "undefined" && CITIES[city] ? CITIES[city] : null;
}
// Непознат квартал НЕ блокира: смята се спрямо центъра на града.
function estimateKm(city, aName, bName, roadFactor) {
  const list = NEIGHBORHOODS[city];
  if (!list || !aName || !bName) return null;
  const center = cityCenter(city);
  const a = findHood(city, aName) || center;
  const b = findHood(city, bName) || center;
  if (!a || !b) return null;
  return Math.max(2, Math.round(haversineKm(a, b) * roadFactor));
}

// намира град по непълно/неточно въведено име
function findCity(name) {
  const q = normHood(name);
  if (!q) return null;
  const keys = Object.keys(CITIES);
  return keys.find(c => normHood(c) === q) || keys.find(c => normHood(c).startsWith(q)) || keys.find(c => normHood(c).includes(q)) || null;
}

// точка за изчисление: първо квартал в града, после самият град
function pointFor(city, hood) {
  const h = findHood(city, hood);
  if (h) return h;
  const c = cityCenter(city);
  if (c) return c;
  const match = findCity(city);
  return match ? CITIES[match] : null;
}

// разстояние между кои да е две точки в страната
// Градове, в които Корект има екипи
const BASES = ["София", "Пловдив", "Варна", "Бургас", "Русе", "Велико Търново"];
function nearestBase(city, roadFactor) {
  let best = null,
    bestKm = Infinity;
  for (const b of BASES) {
    const km = estimateKmAny(b, "", city, "", roadFactor);
    if (km != null && km < bestKm) {
      best = b;
      bestKm = km;
    }
  }
  return best ? {
    city: best,
    km: bestKm
  } : null;
}

// базата е "на маршрута", ако отклонението през нея е под допустимото
function baseOnRoute(from, base, to, roadFactor, tolerance) {
  const direct = estimateKmAny(from, "", to, "", roadFactor);
  const a = estimateKmAny(from, "", base, "", roadFactor);
  const b = estimateKmAny(base, "", to, "", roadFactor);
  if (direct == null || a == null || b == null) return false;
  return a + b <= direct * (tolerance || 1.1);
}

/* Реални пътни разстояния (км, еднопосочно) за маршрути, където изчислението
   по права линия се разминава — напр. планински обходи. Имат превес над формулата.
   Посоката няма значение — записвай ги в какъвто ред е удобно. */
// highwayKm — колко от общите км (еднопосочно) са по магистрала (по-висока скорост,
// виж p.highwaySpeed); остатъкът (km - highwayKm) е по обикновен/първокласен път извън
// града (по-бавно, виж p.roadSpeed) — смесен маршрут, не всичко-или-нищо
const REAL_DISTANCES_RAW = {
  "София|Банско": {
    km: 160
  },
  // изцяло планински път, без магистрала
  "Бургас|Черноморец": {
    km: 25
  },
  // по пътя за Созопол (по права линия излиза по-малко заради залива)
  "София|Пловдив": {
    km: 150,
    highwayKm: 140
  } // магистрала Тракия почти до края, ~10 км градски участъци
};
function realDistanceKey(a, b) {
  return [a, b].sort((x, y) => x.localeCompare(y, "bg")).join("|");
}

// нормализираме ключовете веднъж, за да е без значение в какъв ред са записани
const REAL_DISTANCES = Object.fromEntries(Object.entries(REAL_DISTANCES_RAW).map(([k, v]) => {
  const [a, b] = k.split("|");
  return [realDistanceKey(a, b), v];
}));
function lookupRealDistanceEntry(cityA, cityB) {
  if (!cityA || !cityB) return null;
  const direct = REAL_DISTANCES[realDistanceKey(cityA, cityB)];
  if (direct != null) return direct;

              longitude: ptA.lng

        destination: {

      return trips * (perTripBaseHours + floors * stairsHourPerFloorTrip) / crew;
    };
    const loadCarryClock = legClock(vol / 2, pickupNoElevFloors);
    const unloadCarryClock = legClock(vol / 2, dropoffNoElevFloors);
    handlingClock = loadCarryClock + unloadCarryClock + driveHours;
    // свободното време до минимума се мери БЕЗ стълбите — те се таксуват отделно като перо и не
    // бива да изяждат минимума (иначе опаковането на 5-и етаж би оскъпило камиона, а на партер не)
    const flatClock = legClock(vol / 2, 0) + legClock(vol / 2, 0) + driveHours;
    localMinSlack = Math.max(0, n(p.minLocalHours) - flatClock);
    if (handlingClock < n(p.minLocalHours)) handlingClock = n(p.minLocalHours); // мин 2 ч
  }
  // ръчна промяна на часовете на курса (напр. служителят знае реалния престой) — заменя изчисленото
  const autoHandlingClock = handlingClock;
  const hoursManual = Number(s.hoursOverride) > 0;
  if (hoursManual) handlingClock = Number(s.hoursOverride);
  // Опаковането на 1–2 вещи (10–15 мин) се побира в платения минимум от 2 ч — бригадата и
  // камионът и без това са там. Доплаща се (като труд и като престой на камиона) само
  // опаковането, което излиза извън минимума.
  const packManHoursAll = wrapManHours + protectManHours + boxFillManHours; // вкл. пълнене на кашони/чували
  const packAbsorbedClock = !isCourse && !usesFieldCrew && !isDisposal && !hoursManual && crew > 0 ? Math.min(packManHoursAll / crew, localMinSlack) : 0;
  const packAbsorbedManHours = packAbsorbedClock * crew;
  // при курс с пътуваща бригада вторият човек се плаща за РЕАЛНИТЕ часове (път + работа) × часова ставка,
  // без таван — 10 часа = 10 × ставката, 12 часа = 12 × ставката и т.н.
  const dayTotalH = handlingClock + driveHours;
  const travelDays = isCourse ? Math.max(1, Math.ceil(dayTotalH / n(p.dayHours || 10))) : 0; // само за информация
  const dayCrewMode = isCourse && s.courseMode === "dayCrew";
  const localCrewMode = isCourse && s.courseMode === "localCrew";
  const selfUnloadMode = isCourse && s.courseMode === "selfUnload"; // клиентът разтоварва сам

  // База с екип за разтоварване (вариант 2) — автоматично най-близката или ръчно избрана
  const autoBase = localCrewMode ? nearestBase(s.dropoffCity, n(p.roadFactorBG || 1.25)) : null;
  const baseCity = localCrewMode ? s.baseCity || autoBase?.city || null : null;
  const baseKm = baseCity ? estimateKmAny(baseCity, "", s.dropoffCity, "", n(p.roadFactorBG || 1.25)) : 0;
  const baseIsOnRoute = baseCity ? baseOnRoute(s.pickupCity, baseCity, s.dropoffCity, n(p.roadFactorBG || 1.25), n(p.routeDetourTolerance || 1.1)) : false;
  // кола трябва, ако базата е встрани от маршрута ИЛИ служителят я е поискал изрично
  const needCar = !!baseCity && (!baseIsOnRoute || !!s.forceCar);

  // реални разходи, платени "на трето лице" за материали/превоз (кола, стреч, велпапе,
  // чували, такса сметище) — начисляват се на клиента почти на себестойност, но без тях
  // маржът в панел "Марж" излизаше завишен, все едно е чиста печалба
  let extraCostTotal = 0;
  let materialsCost = 0; // част от extraCostTotal: стреч, велпапе, кашони — отделен ред „Материали“ в марж панела

  let handlingManHours;
  if (dayCrewMode) {
    // цената към клиента е на ден/час × хора (не по-долу), но реалните човекочасове
    // все пак трябва да влязат в manHours — иначе "Време труд" показва само опаковането,
    // а себестойността (laborCost = manHours × workerCostRate) излиза почти нулева,
    // въпреки че реално плащаме на екипа за целия ден
    const people = n(p.travelCrew || 1) + 1; // + шофьорът, който също товари/разтоварва на място
    handlingManHours = dayTotalH * people;
    add(`Придружаващ работник — ${dayTotalH.toFixed(1)} ч × ${people} ${people === 1 ? "човек" : "души"} × ${workerRate} ${p.currency}/ч`, dayTotalH * people * workerRate);
  } else if (localCrewMode) {
    // товаренето при клиента + местна бригада, която пътува до адреса и разтоварва
    handlingManHours = loadClock * crew;
    add(`Товарене (${s.pickupCity}) — ${loadClock.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, handlingManHours * workerRate);
    const crewDriveH = baseKm ? 2 * baseKm / n(p.roadSpeed || 65) : 0; // отиване и връщане
    const crewWorkH = Math.max(n(p.unloadHours) * trips, n(p.localCrewMinHours || 2)); // мин. 2 ч работа
    const crewHours = crewDriveH + crewWorkH;
    const people = n(p.localCrewSize || 2);
    add(`Местна бригада ${baseCity ? `(${baseCity})` : ""} — ${crewWorkH.toFixed(1)} ч работа + ${crewDriveH.toFixed(1)} ч път × ${people} души × ${workerRate} ${p.currency}/ч`, crewHours * people * workerRate);
    handlingManHours += crewHours * people;
    if (baseCity && needCar) {
      const fee = 2 * baseKm * n(p.carRatePerKm);
      add(`Кола ${baseCity} → ${s.dropoffCity} — ${2 * baseKm} км × ${n(p.carRatePerKm)} ${p.currency}/км`, fee, true);
      extraCostTotal += fee;
    }
  } else if (isDisposal) {
    // изнасяне + път до сметището и обратно + изсипване
    // При няколко камиона, работещи паралелно, общата работа (и цена) е същата,
    // но календарното време се дели на броя камиони/екипи.
    // Общият брой хора е ограничен (напр. Варна — макс. 8 души на разположение).
    const trucksN = disposalTrucksN;
    const disposalRate = n(p.disposalWorkerRate || workerRate);
    const maxWorkers = n(p.disposalMaxWorkers || 8);
    const totalCrew = Math.min(crew * trucksN, maxWorkers);
    disposalTotalCrew = totalCrew;
    fillClockElapsed = fillManHours / totalCrew; // реално време за пълнене, ако помагат всички
    const carryClock = vol / n(p.m3PerManHour || 1) / totalCrew;
    const dumpClockTotal = trips * n(p.dumpHoursPerTrip);
    const driveHoursElapsed = driveHours / trucksN; // driveHours е общо за всички курсове
    const dumpClockElapsed = dumpClockTotal / trucksN;
    let jobClock = carryClock + driveHoursElapsed + dumpClockElapsed;
    if (jobClock < n(p.minDisposalHours)) jobClock = n(p.minDisposalHours);
    handlingClock = jobClock; // само престоят на камиона — за него се таксува транспортът
    handlingManHours = jobClock * totalCrew;
    if (fillManHours) {
      const h = roundHalf(fillManHours);
      add(`Пълнене на ${sacks} чувала — ${h.toFixed(1)} чч × ${disposalRate} ${p.currency}/ч`, h * disposalRate);
    }
    if (sacks > 0) {
      const fee = sacks * n(p.sackPrice);
      add(`Чували — ${sacks} бр. × ${n(p.sackPrice)} ${p.currency}/бр.`, fee, true);
      extraCostTotal += fee;
    }
    {
      const h = roundHalf(jobClock);
      add(`Изнасяне, извозване и изсипване${trucksN > 1 ? ` (${trucksN} камиона)` : ""} — ${h.toFixed(1)} ч × ${totalCrew} души × ${disposalRate} ${p.currency}/ч`, h * totalCrew * disposalRate);
    }
  } else if (isLabourOnly) {
    // само хамали — клиентът осигурява транспорта за багажа.
    // Ако работата е в друг град, се плаща кола за хората + времето за път.
    const carryClock = vol / n(p.m3PerManHour || 1.6) / crew;
    let jobClock = carryClock;
    if (jobClock < n(p.minLocalHours)) jobClock = n(p.minLocalHours); // мин. 2 ч

    // разстояние от базата до града на работа (0, ако е в същия град)
    const labourKm = labourTravelKm;
    const travelH = labourKm ? 2 * labourKm / n(p.roadSpeed || 65) : 0; // отиване и връщане

    handlingClock = jobClock + travelH;
    handlingManHours = handlingClock * crew;
    {
      const h = roundHalf(jobClock);
      add(`Товарене и пренасяне — ${h.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, h * crew * workerRate);
    }
    if (travelH > 0) {
      const h = roundHalf(travelH);
      add(`Път на бригадата (${labourBaseCity} → ${s.city}) — ${h.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, h * crew * workerRate);
    }
    // кола за бригадата — винаги, с минимална такса дори в рамките на града
    const carKmFee = labourKm ? 2 * labourKm * n(p.carRatePerKm) : 0;
    const carFee = Math.max(carKmFee, n(p.labourMinCarFee || 0));
    if (carFee > 0) {
      add(labourKm ? `Кола за бригадата — ${2 * labourKm} км × ${n(p.carRatePerKm)} ${p.currency}/км` : `Кола за бригадата (в града) — минимална такса`, carFee, true);
      extraCostTotal += carFee;
    }
  } else if (isManualHoursService) {
    // монтаж на мебели / ТРД — часовете се въвеждат ръчно от служителя (по преценка на място),
    // не се смятат от обем. Пътят на бригадата и колата работят по същия начин като "Само хамали".
    const jobClock = Math.max(n(s.manualHours || 0), n(p.minLocalHours));
    const labourKm = labourTravelKm;
    const travelH = labourKm ? 2 * labourKm / n(p.roadSpeed || 65) : 0;
    handlingClock = jobClock + travelH;
    handlingManHours = handlingClock * crew;
    const jobRate = isAssembly ? disAsmRate : workerRate; // монтажът е квалифициран труд
    {
      const h = roundHalf(jobClock);
      add(`${isAssembly ? "Монтаж на мебели" : "Товарене/разтоварване"} — ${h.toFixed(1)} ч × ${crew} души × ${jobRate} ${p.currency}/ч`, h * crew * jobRate);
    }
    if (travelH > 0) {
      const h = roundHalf(travelH);
      add(`Път на бригадата (${labourBaseCity} → ${s.city}) — ${h.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, h * crew * workerRate);
    }
    const carKmFee = labourKm ? 2 * labourKm * n(p.carRatePerKm) : 0;
    const carFee = Math.max(carKmFee, n(p.labourMinCarFee || 0));
    if (carFee > 0) {
      add(labourKm ? `Кола за бригадата — ${2 * labourKm} км × ${n(p.carRatePerKm)} ${p.currency}/км` : `Кола за бригадата (в града) — минимална такса`, carFee, true);
      extraCostTotal += carFee;
    }
  } else if (selfUnloadMode) {
    // клиентът разтоварва сам — плаща се само товаренето при него
    handlingManHours = loadClock * crew;
    handlingClock = loadClock;
    {
      const h = roundHalf(loadClock);
      add(`Товарене (${s.pickupCity}) — ${h.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, h * crew * workerRate);
    }
  } else {
    handlingManHours = handlingClock * crew;
    if (hoursManual) {
      // ръчно зададени часове — един общ ред вместо автоматичното разделяне на товарене/разтоварване
      const h = roundHalf(handlingClock);
      add(`Товарене и разтоварване (ръчно) — ${h.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, h * crew * workerRate);
    } else if (isCourse) {
      const hL = roundHalf(loadClock),
        hU = roundHalf(unloadClock);
      add(`Товарене — ${hL.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, hL * crew * workerRate);
      add(`Разтоварване — ${hU.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, hU * crew * workerRate);
    } else {
      const h = roundHalf(handlingClock);
      add(`Пренасяне и път — ${h.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, h * crew * workerRate);
    }
  }

  // Нощувка: ако работа + път в ЕДНАТА посока надхвърли прага
  const oneWayDriveH = isCourse ? driveHoursOneWay(s.pickupCity, s.dropoffCity, oneWayKm, p) : 0;
  const nights = isCourse ? Math.max(0, Math.ceil((oneWayDriveH + handlingClock - n(p.overnightThresholdH || 8)) / n(p.dayHours || 10))) : 0;
  if (nights > 0) {
    const sleepers = 1 + (dayCrewMode ? n(p.travelCrew || 1) : 0); // шофьор (+ придружаващ)
    add(`Нощувка — ${nights} ${nights === 1 ? "нощ" : "нощи"} × ${sleepers} ${sleepers === 1 ? "човек" : "души"} × ${n(p.overnightPrice)} ${p.currency}`, nights * sleepers * n(p.overnightPrice));
  }

  // 2) РАЗГЛОБЯВАНЕ/СГЛОБЯВАНЕ — реални часове × хора по демонтажа, квалифициран труд (камионът чака, но не се таксува)
  if (disOnlyManHours) {
    const h = roundHalf(disOnlyHours);
    add(`Разглобяване (${s.pickupHood || s.pickupCity || "товарене"}) — ${h.toFixed(1)} ч × ${disCrew} души × ${disAsmRate} ${p.currency}/ч`, h * disCrew * disAsmRate);
  }
  if (asmOnlyManHours) {
    const h = roundHalf(asmOnlyHours);
    add(`Сглобяване (${s.dropoffHood || s.dropoffCity || "разтоварване"}) — ${h.toFixed(1)} ч × ${asmCrew} души × ${disAsmRate} ${p.currency}/ч`, h * asmCrew * disAsmRate);
  }

  // 3) ОПАКОВАНЕ — човекочаса
  const packChargedManHours = packManHoursAll - packAbsorbedManHours;
  if (packChargedManHours > 1e-6) {
    const h = roundHalf(packChargedManHours);
    add(`Опаковане${boxFillManHours ? " и пълнене на кашони" : ""} — ${h.toFixed(1)} чч × ${workerRate} ${p.currency}/ч`, h * workerRate);
  }

  // 3.5) НОСЕНЕ НА ДЪЛГО РАЗСТОЯНИЕ до/от камиона — реално добавено време, не само такса
  const carryExtraHoursFor = a => {
    const extra = Math.max(0, n(a?.carryDistanceM || 0) - n(p.carryFreeDistanceM || 0));
    if (extra <= 0) return 0;
    return Math.ceil(extra / 10) * n(p.carryExtraMinPer10m || 0) / 60;
  };
  const skipDropoffCarry = isDisposal || selfUnloadMode || usesFieldCrew;
  const carryHoursTot = carryExtraHoursFor(s.pickup) + (skipDropoffCarry ? 0 : carryExtraHoursFor(s.dropoff));
  const carryManHours = carryHoursTot * crew;
  if (carryHoursTot) {
    const h = roundHalf(carryHoursTot);
    add(`Носене на дълго разстояние до камиона — ${h.toFixed(1)} ч × ${crew} души × ${workerRate} ${p.currency}/ч`, h * crew * workerRate);
  }

  // СТЪЛБИ — парична такса на етаж, на адрес (товарене + разтоварване). За всяка вещ служителят
  // може да отбележи с s.floorFeeOff (и за колко бройки), че НЕ се качва по стълби (напр. остава
  // на партера, качва се с кран/асансьор през прозорец) — тези бройки се изваждат от таксата.
  // Изчислено ТУК (преди manHours/clockHours), защото носенето по стълби е реална извънредна
  // работа, не само такса — времето за изпълнение трябва да я отразява (виж stairsManHours по-долу),
  // иначе 5 етажа без асансьор излизат само по-скъпи, но не и по-бавни от партер.
  const boxes = netFloorQty(s.qty, s.floorFeeOff, it => it.kind === "box" || it.kind === "sack"); // чувалите се носят като кашони
  const appNormal = netFloorQty(s.qty, s.floorFeeOff, it => it.kind === "appliance");
  const appHeavy = netFloorQty(s.qty, s.floorFeeOff, it => it.kind === "appliance_heavy");
  const oversized = netFloorQty(s.qty, s.floorFeeOff, it => it.kind === "oversized");
  const small = netFloorQty(s.qty, s.floorFeeOff, it => it.kind === "small"); // дребни/леки вещи (картина, килим, лампа, стол...)
  const furniture = netFloorQty(s.qty, s.floorFeeOff, it => !FLOOR_FEE_KINDS.has(it.kind)); // обикновени мебели — без категория
  // стандартни вещи: стълби само при липса на асансьор
  const floorsStd = a => a.floor >= 1 && !a.elevator ? a.floor : 0;
  // едрогабаритни (диван 3-ка и под.): не влизат в пътнически асансьор → стълби, освен при товарен
  const floorsOvr = a => a.floor >= 1 && !(a.elevator && a.elevatorType === "cargo") ? a.floor : 0;
  const perFloorStd = n(p.floorFeeNoElevator) + boxes * n(p.boxPerFloor) + appNormal * n(p.appliancePerFloor) + appHeavy * n(p.heavyAppliancePerFloor) + small * n(p.smallItemPerFloor) + furniture * n(p.furniturePerFloor);
  // едрогабаритните (диван 3-ка, ъглов диван) са мебели, не "спец. уред" — носят мебелната
  // ставка; отделната категория oversized съществува само заради асансьора (не влизат в
  // пътнически), не заради по-скъпа такса
  const perFloorOvr = oversized * n(p.furniturePerFloor);
  // при изхвърляне няма адрес на доставка (само сметище); при самостоятелно разтоварване стълбите там са за сметка на клиента
  const skipDropoffFloors = isDisposal || selfUnloadMode || usesFieldCrew;
  const floorsStdTot = floorsStd(s.pickup) + (skipDropoffFloors ? 0 : floorsStd(s.dropoff));
  const floorsOvrTot = floorsOvr(s.pickup) + (skipDropoffFloors ? 0 : floorsOvr(s.dropoff));
  const stairs = floorsStdTot * perFloorStd + floorsOvrTot * perFloorOvr;
  // превръща таксата за стълби в реални човекочасове по стандартната работническа ставка —
  // екипът реално отделя толкова допълнително време, не само плаща толкова допълнително
  const stairsManHoursAll = workerRate > 0 ? stairs / workerRate : 0;
  // Стълбите при дребна задача влизат в платения минимум от 2 ч (решение 18.11.2026): бригадата
  // и без това е платена за 2 ч, а реалната работа е под час. Опаковането заема свободното
  // време първо, стълбите — каквото остане; доплаща се само частта извън минимума.
  const stairsAbsorbedManHours = !isCourse && !usesFieldCrew && !isDisposal && !hoursManual && crew > 0 ? Math.min(stairsManHoursAll, Math.max(0, localMinSlack - packAbsorbedClock) * crew) : 0;
  const stairsManHours = stairsManHoursAll - stairsAbsorbedManHours; // таксуваната част
  const stairsCharged = stairsManHoursAll > 0 ? stairs * (stairsManHours / stairsManHoursAll) : 0;

  // опаковането, побрало се в минимума, вече е в handlingManHours/handlingClock — не се брои втори път
  const manHours = handlingManHours + disManHours + wrapManHours + protectManHours + boxFillManHours - packAbsorbedManHours + fillManHours + carryManHours + stairsManHours;
  const clockHours = handlingClock + fillClockElapsed + disHours + carryHoursTot + (crew ? (packManHoursAll + stairsManHours) / crew : packManHoursAll + stairsManHours) - packAbsorbedClock; // общ престой на обекта — информативно (Очаквано време, бригада)
  // часовете, по които се таксува КАМИОНЪТ при градско (виж truckCostBasis) — БЕЗ стълбите:
  // те вече се начисляват директно като перо "Стълби без асансьор" (парична такса на етаж
  // на вещ); ако същото забавяне се качи и в часовете на транспорта, се получава двойно
  // начисляване на едно и също нещо (веднъж като такса, втори път като по-скъп транспорт)
  const truckClockHours = clockHours - (crew ? stairsManHours / crew : stairsManHours);
  // Часове на камиона (градско). Ръчно зададени (s.truckHoursOverride) заменят изчисленото.
  // Докато екипът разглобява/сглобява/опакова, камионът стои на обекта по намалена ставка
  // (p.truckWorkPct); при голямо преместване (над p.truckWorkBigM3 м³) камионът ходи за материали
  // и не стои там — тези часове не се таксуват (p.truckWorkPctBig, начално 0%). Решения 18.11.2026.
  const autoTruckHours = roundHalf(truckClockHours);
  const truckHoursManual = Number(s.truckHoursOverride) > 0 && !isCourse && !isDisposal && !usesFieldCrew;
  const truckH = truckHoursManual ? Number(s.truckHoursOverride) : autoTruckHours;
  const bigMove = vol > n(p.truckWorkBigM3 || 1e9);
  const truckWorkPctUsed = Math.min(100, Math.max(0, n(bigMove ? p.truckWorkPctBig ?? 0 : p.truckWorkPct ?? 100)));
  const truckWorkClock = disHours + (crew ? (packManHoursAll - packAbsorbedManHours) / crew : 0);
  const truckHWork = !truckHoursManual && truckWorkPctUsed < 100 ? Math.min(truckH, roundHalf(truckWorkClock)) : 0;
  const truckHFull = truckH - truckHWork;
  // над 10 часа на ден не се работи — толкова дни реално са нужни за изпълнение
  const workDays = Math.max(1, Math.ceil(clockHours / n(p.dayHours || 10)));
  // задачата се побира изцяло в минимума (градско, без ръчни часове, нищо извън 2-та часа)
  const onLocalMinimum = !isCourse && !usesFieldCrew && !isDisposal && !hoursManual && crew > 0 && localMinSlack > 0 && clockHours <= n(p.minLocalHours) + 1e-9;

  // спец. обработка
  Object.entries(s.qty).forEach(([id, cnt]) => {
    const it = ITEM_INDEX[id];
    if (it?.surcharge && cnt > 0) add(`${it.label} — спец. обработка ×${cnt}`, it.surcharge * cnt);
  });
  if (stairsCharged > 1e-6) {
    const parts = [];
    if (floorsStdTot && boxes) parts.push(`${boxes} каш.`);
    if (floorsStdTot && appNormal) parts.push(`${appNormal} уред`);
    if (floorsStdTot && appHeavy) parts.push(`${appHeavy} спец.`);
    if (floorsStdTot && small) parts.push(`${small} дребни`);
    if (floorsStdTot && furniture) parts.push(`${furniture} мебел`);
    if (floorsOvrTot && oversized) parts.push(`${oversized} едрогаб.`);
    const floorParts = [];
    if (floorsStd(s.pickup)) floorParts.push(`${s.pickupHood || s.pickupCity || "товарене"}: ${floorsStd(s.pickup)} ет.`);
    if (!skipDropoffFloors && floorsStd(s.dropoff)) floorParts.push(`${s.dropoffHood || s.dropoffCity || "разтоварване"}: ${floorsStd(s.dropoff)} ет.`);
    add(`Стълби без асансьор${parts.length ? " · " + parts.join(", ") : ""}${floorParts.length ? " (" + floorParts.join(", ") + ")" : ""}${stairsAbsorbedManHours > 1e-6 ? " — частта извън минимума" : ""}`, stairsCharged);
  } else if (stairs) {
    lines.push({
      label: `Стълби без асансьор — влизат в минимума от ${n(p.minLocalHours)} ч`,
      amount: 0
    });
  }

  // ТРАНСПОРТ (перо) — само за времето, в което камионът реално участва.
  // При "само хамали"/монтаж/ТРД транспортът на стоката не е наш и не се начислява.
  if (usesFieldCrew) {
    // без транспортно перо
  } else if (isDisposal) {
    const totalTruckHours = roundHalf(handlingClock * disposalTrucksN); // сума от часовете на всички камиони
    add(`Транспорт${disposalTrucksN > 1 ? ` (${disposalTrucksN} камиона)` : ""} — ${totalTruckHours.toFixed(1)} ч × ${n(p.truckRate)} ${p.currency}/ч (${totalKm} км до сметището)`, totalTruckHours * n(p.truckRate));
    const fee = n((p.landfillFees || {})[wasteType]);
    if (fee > 0) {
      add(`Такса сметище (${WASTE_LABEL[wasteType]}) — ${trips} курс${trips === 1 ? "" : "а"} × ${fee} ${p.currency}`, trips * fee);
      extraCostTotal += trips * fee;
    }
  } else if (!isCourse) {
    // камионът стои на обекта през цялото пренасяне — включително разглобяване/сглобяване
    // и опаковане, не само товарене-движение-разтоварване — затова часовете са truckClockHours
    // (= clockHours), не само handlingClock. Стълбите обаче са изключени тук — те вече се
    // таксуват отделно (перото "Стълби без асансьор" по-горе); иначе едно и също забавяне
    // би оскъпило и там, и тук.
    if (truckHWork > 1e-6) {
      const rWork = Math.round(n(p.truckRate) * truckWorkPctUsed) / 100;
      if (truckHFull > 1e-6) add(`Транспорт — ${truckHFull.toFixed(1)} ч × ${n(p.truckRate)} ${p.currency}/ч`, truckHFull * n(p.truckRate));
      if (rWork > 0) add(`Транспорт при разглобяване/сглобяване/опаковане — ${truckHWork.toFixed(1)} ч × ${rWork} ${p.currency}/ч (${truckWorkPctUsed}%)`, truckHWork * rWork);else lines.push({
        label: `Транспорт: ${truckHWork.toFixed(1)} ч разглобяване/сглобяване/опаковане не се таксуват — камионът не стои на обекта`,
        amount: 0
      });
    } else {
      add(`Транспорт — ${truckH.toFixed(1)} ч × ${n(p.truckRate)} ${p.currency}/ч`, truckH * n(p.truckRate));
    }
  } else {
    const rate = chosen ? chosen.kmRate : n(p.kmRate);
    if (totalKm) add(`Транспорт — ${totalKm} км × ${rate} ${p.currency}/км`, totalKm * rate);
  }

  // материали — реален разход почти на себестойност, приспада се в марж панела по-долу
  if (protectMeters) {
    const fee = protectMeters * n(p.protectPricePerM);
    add(`Велпапе / автопласт — ${protectMeters} м × ${n(p.protectPricePerM)} ${p.currency}/м`, fee, true);
    extraCostTotal += fee;
    materialsCost += fee;
  }
  if (rolls) {
    const fee = rolls * rollPrice;
    if (rollsManual) {
      add(`Стреч фолио — ${rolls} ${rolls === 1 ? "ролка" : "ролки"} × ${rollPrice} ${p.currency}`, fee, true);
      // себестойността е по покупната цена на ролка (Параметри), разликата до цената за клиента е марж
      const cost = rolls * n(p.stretchRollPrice);
      extraCostTotal += cost;
      materialsCost += cost;
    } else {
      add(`Стреч фолио — ${wrapMeters} м × ${(n(p.stretchRollPrice) / n(p.stretchRollM || 1)).toFixed(4)} ${p.currency}/м`, fee, true);
      extraCostTotal += fee;
      materialsCost += fee;
    }
  }
  for (const b of boxBuy) {
    const fee = b.cnt * b.price;
    add(`${b.label} от нас — ${b.cnt} бр. × ${b.price} ${p.currency}`, fee, true);
    // кашоните се продават с марж (по подразбиране 30%) — в себестойността влиза само покупната им цена
    const cost = fee * (1 - Math.min(100, Math.max(0, n(p.boxMarginPct ?? 30))) / 100);
    extraCostTotal += cost;
    materialsCost += cost;
  }

  // отклонение (буфер) — прилага се ПРЕДИ прага за минимум, за да е минималната цена,
  // която въвеждаш в Параметри, наистина минимумът, който клиентът вижда (а не мин×буфер)
  // може да се коригира и ръчно за конкретната калкулация (s.deviationOverride), напр. при
  // нетипична поръчка — 0 означава "ползвай стойността от ⚙ Параметри"
  const deviationManual = Number(s.deviationOverride) > 0;
  // задача изцяло в минимума: без буфер — резервът вече е в самия минимум (реалната работа е под 2 ч)
  const deviationFactor = deviationManual ? n(s.deviationOverride) : onLocalMinimum ? 1 : n(p.deviationFactor || 1) || 1;
  if (deviationFactor !== 1) {
    // информативен ред — реалната (изчислената) цена преди буфера, само за показване,
    // не пипа total; веднага след него идва самото отклонение, а общата сума е накрая
    lines.push({
      label: "Реална цена (преди отклонение)",
      amount: Math.round(total)
    });
    const percent = Math.round((deviationFactor - 1) * 100);
    add(`Отклонение (${percent >= 0 ? "+" : ""}${percent}%)`, total * (deviationFactor - 1));
  }

  // праг — след отклонението
  const floor = n(p.minPrice[s.service === "disposal" || usesFieldCrew ? "local" : s.service]);
  if (total < floor) {
    lines.push({
      label: "Изравняване до минимум",
      amount: Math.round(floor - total)
    });
    total = floor;
  }

  // никога не показваме отрицателна (или безсмислена) цена на клиента, независимо от
  // комбинацията параметри (напр. отрицателен коеф. на отклонение)
  total = Math.max(0, total);

  // СКЛАДИРАНЕ — месечна цена според обема; НЕ влиза в total (той е еднократната цена за
  // пренасянето). Кашони, чували, дребни вещи и уреди се редят на палета; мебелите са
  // „насипен“ багаж на кубик. s.storage.mode: "auto" (по вид на вещта) | "pallet" | "loose".
  let storage = null;
  if (s.storage?.on && !isDisposal) {
    const PALLET_KINDS = new Set(["box", "sack", "small", "appliance", "appliance_heavy"]);
    const mode = s.storage.mode || "auto";
    let palletVol = 0,
      looseVol = 0;
    for (const [id, cnt] of Object.entries(s.qty)) {
      const it = ITEM_INDEX[id];
      if (!it || !(cnt > 0)) continue;
      const v = n(it.m3) * cnt;
      if (mode === "pallet" || mode !== "loose" && PALLET_KINDS.has(it.kind)) palletVol += v;else looseVol += v;
    }
    const pallets = palletVol > 0 ? Math.ceil(palletVol / (n(p.palletM3) || 1.4) - 1e-9) : 0;
    const looseM3 = Math.ceil(looseVol * 2 - 1e-9) / 2; // на половин кубик нагоре
    const monthly = Math.round((pallets * n(p.palletPrice) + looseM3 * n(p.looseM3Price)) * 100) / 100;
    const months = Math.max(1, Math.round(n(s.storage.months || 1)));
    storage = {
      mode,
      pallets,
      palletVol: +palletVol.toFixed(2),
      looseM3,
      palletPrice: n(p.palletPrice),
      looseM3Price: n(p.looseM3Price),
      monthly,
      months,
      total: Math.round(monthly * months * 100) / 100
    };
  }

  // СЕБЕСТОЙНОСТ И МАРЖ — вътрешни данни (реален разход), не влияят на цената на клиента.
  // costCity/workerCostRate вече са изчислени най-отгоре (общи и за цената към клиента).
  const laborCost = manHours * workerCostRate;
  const truckCostRate = usesFieldCrew ? 0 : n(isCourse || isDisposal ? p.truckCostPerKm : p.truckCostPerHour);
  // градско: СЪЩИТЕ часове като перото "Транспорт" към клиента (truckClockHours, закръглени) —
  // без стълбите: по стълбите носят хората, камионът не участва (виж калк. №143 — 3.0 ч към
  // клиента, а 3.99 ч в маржа, заради 1 ч носене на ъглов диван)
  // при голямо преместване (0%) камионът реално не стои през разглобяването — не е и разход
  const truckCostBasis = isCourse || isDisposal ? totalKm : truckHoursManual ? truckH : truckWorkPctUsed === 0 ? truckHFull : autoTruckHours;
  const truckCost = usesFieldCrew ? 0 : truckCostBasis * truckCostRate;
  // материали + кола + такса сметище (реален разход, минус за да не изглежда маржа завишен)
  const totalCost = laborCost + truckCost + extraCostTotal;
  const margin = total - totalCost;
  const marginPercent = total > 0 ? margin / total * 100 : 0;
  return {
    total: Math.round(total),
    lines,
    boxFillManHours,
    boxBuy,
    materialsCost: Math.round(materialsCost * 100) / 100,
    otherCost: Math.round((extraCostTotal - materialsCost) * 100) / 100,
    costCity,
    workerCostRate,
    workerRate,
    deviationFactor,
    deviationManual,
    floorsStdTot,
    floorsOvrTot,
    laborCost: Math.round(laborCost),
    truckCost: Math.round(truckCost),
    totalCost: Math.round(totalCost),
    margin: Math.round(margin),
    marginPercent,
    vol,
    weight,
    isDisposal,
    isLabourOnly,
    isManualHoursService,
    usesFieldCrew,
    labourBaseCity,
    labourTravelKm,
    labourAutoBaseCity: labourAutoBase?.city || null,
    wasteType,
    sacks,
    fillManHours,
    tons,
    landfillKm,
    disposalTrucksN,
    disposalTotalCrew,
    payload,
    weightLimited,
    tripsByVol,
    tripsByKg,
    manHours,
    crew,
    clockHours,
    workDays,
    trips,
    cap,
    chosen,
    oneWayKm,
    autoOneWayKm,
    kmManual,
    totalKm,
    driveHours,
    fleet,
    auto: !picked,
    isCourse,
    crewByProtocol,
    autoCrew,
    crewManual,
    reqCrew,
    disHours,
    disManHours,
    disCrew,
    asmCrew,
    disOnlyHours,
    asmOnlyHours,
    disOnlyManHours,
    asmOnlyManHours,
    work,
    wrapMeters,
    wrapHours,
    wrapManHours,
    rolls,
    protectMeters,
    protectManHours,
    handlingClock,
    autoHandlingClock,
    hoursManual,
    autoTruckHours,
    truckHoursManual,
    truckH,
    truckHWork,
    handlingManHours,
    loadClock,
    unloadClock,
    travelDays,
    dayCrewMode,
    localCrewMode,
    selfUnloadMode,
    baseCity,
    baseKm,
    baseIsOnRoute,
    needCar,
    nights,
    oneWayDriveH,
    carryHoursTot,
    carryManHours,
    storage
  };
}

/* ================= ЗАПИС НА КАЛКУЛАЦИИ (база данни) ================= *
 *  Всяка показана калкулация се записва автоматично, дори без контакти.
 *  Ключ: calc:<timestamp>-<rand>. Споделено хранилище → достъпно за Корект.
 * =================================================================== */
const WASTE_LABEL = {
  household: "битов",
  construction: "строителен",
  mixed: "смесен"
};
const CALC_PREFIX = "calc:";

/* --- Устойчив слой над хранилището ---------------------------------
 * Някои среди не позволяват споделено хранилище (или изобщо нямат такова).
 * Опитваме споделено → лично → отказ, и помним кое е проработило.
 * ------------------------------------------------------------------ */
let storageMode = null; // null = непроверено | "shared" | "personal" | "none"
const hasStorage = () => !!(typeof window !== "undefined" && window.storage && typeof window.storage.set === "function");
const modesToTry = () => storageMode && storageMode !== "none" ? [storageMode] : ["shared", "personal"];
const getStorageMode = () => storageMode;
async function storageSet(key, value) {
  if (!hasStorage()) {
    storageMode = "none";
    return false;
  }
  for (const m of modesToTry()) {
    try {
      const res = await window.storage.set(key, value, m === "shared");
      if (res) {
        storageMode = m;
        return true;
      }
    } catch (e) {/* пробваме следващия режим */}
  }
  storageMode = "none";
  return false;
}
async function storageGet(key) {
  if (!hasStorage()) {
    storageMode = "none";
    return null;
  }
  for (const m of modesToTry()) {
    try {
      const res = await window.storage.get(key, m === "shared");
      if (res?.value) {
        storageMode = m;
        return res.value;
      }
    } catch (e) {/* липсващ ключ или недостъпен режим */}
  }
  return null;
}
async function storageList(prefix) {
  if (!hasStorage()) {
    storageMode = "none";
    return [];
  }
  for (const m of modesToTry()) {
    try {
      const res = await window.storage.list(prefix, m === "shared");
      if (res?.keys) {
        storageMode = m;
        return res.keys;
      }
    } catch (e) {/* пробваме следващия режим */}
  }
  return [];
}
const PARAMS_KEY = "config:pricing";
// името вече се пази в профила на акаунта (user_metadata.display_name в Supabase) — важи
// на всяко устройство. Локалният кеш по-долу е само за мигновено показване при зареждане,
// преди да е дошъл отговорът от Supabase; ключуван по имейл, за да не се "просмуква" между
// различни колеги на споделена машина.
const USER_NAME_CACHE_PREFIX = "korekt:userName:";
function loadCachedUserName(email) {
  if (!email) return "";
  try {
    return localStorage.getItem(USER_NAME_CACHE_PREFIX + email.trim().toLowerCase()) || "";
  } catch (e) {
    return "";
  }
}
function saveCachedUserName(email, name) {
  if (!email) return;
  try {
    localStorage.setItem(USER_NAME_CACHE_PREFIX + email.trim().toLowerCase(), name);
  } catch (e) {/* без значение */}
}

// чернова на текущата (незавършена) калкулация — за да не се губи при презареждане/затворен таб,
// въпреки надписа "данните се записват автоматично" под формата за заявка. Ключувана по имейл
// на логнатия колега (не общо на устройството) — иначе на споделена машина всеки следващ
// влязъл вижда недовършената калкулация на предишния колега, вместо чист начален екран.
const DRAFT_KEY_PREFIX = "korekt:draft:";
const DRAFT_MAX_AGE_MS = 24 * 60 * 60 * 1000; // не възстановяваме чернова, по-стара от денонощие
function loadDraft(email) {
  if (!email) return null;
  try {
    const raw = localStorage.getItem(DRAFT_KEY_PREFIX + email.trim().toLowerCase());
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return null;
    if (!parsed.savedAt || Date.now() - parsed.savedAt > DRAFT_MAX_AGE_MS) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}
function saveDraftLS(email, step, s, recordKey, recordNumber, pushed, carry) {
  if (!email) return;
  try {
    localStorage.setItem(DRAFT_KEY_PREFIX + email.trim().toLowerCase(), JSON.stringify({
      step,
      s,
      recordKey,
      recordNumber,
      pushed,
      carry: carry || null,
      savedAt: Date.now()
    }));
  } catch (e) {/* без значение — просто няма да се възстанови */}
}
function clearDraftLS(email) {
  if (!email) return;
  try {
    localStorage.removeItem(DRAFT_KEY_PREFIX + email.trim().toLowerCase());
  } catch (e) {/* без значение */}
}

// --- Достъп до вътрешните панели (Записи / Параметри / Марж) ---------------
// Истински вход през Supabase Auth (имейл + парола), не UI парола в кода.
// RLS на "calculations" (от 08.11.2026, supabase/migrations/20261108_lock_calculations.sql):
// четене/запис/триене само за authenticated — затова ВСЕКИ fetch към calculations трябва
// да носи authHeaders(session, ...), не supabaseHeaders(anonKey). Гласовият асистент
// пише през RPC save_voice_calc (само id "calc:voice-...").
const AUTH_SESSION_KEY = "korekt:authSession";
function loadAuthSession() {
  try {
    const raw = localStorage.getItem(AUTH_SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return s && s.access_token ? s : null;
  } catch (e) {
    return null;
  }
}
function saveAuthSession(session) {
  try {
    if (session) localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(session));else localStorage.removeItem(AUTH_SESSION_KEY);
  } catch (e) {/* без значение */}
}
// Само служебни имейли могат да се регистрират сами през формата в приложението.
// Това е проверка откъм клиента (удобство, не сигурност) — истинската граница е,
// че Supabase Auth изисква потвърждение на имейла, а никой външен няма достъп до
// пощенска кутия на korekt-bg.com, за да потвърди регистрация с такъв домейн.
// За допълнителна защита на ниво база виж README ("Вход за екипа") — trigger, който
// отхвърля регистрации с друг домейн директно в Postgres.
const SIGNUP_ALLOWED_DOMAIN = "korekt-bg.com";
function isAllowedSignupEmail(email) {
  return String(email || "").trim().toLowerCase().endsWith("@" + SIGNUP_ALLOWED_DOMAIN);
}
async function supabaseSignUp(email, password, url, key) {
  if (!url || !key) return {
    ok: false,
    error: "Няма връзка към Supabase (виж ⚙ Параметри)."
  };
  if (!isAllowedSignupEmail(email)) {
    return {
      ok: false,
      error: `Регистрация само с @${SIGNUP_ALLOWED_DOMAIN} имейл.`
    };
  }
  try {
    const res = await fetch(`${url}/auth/v1/signup`, {
      method: "POST",
      headers: {
        apikey: key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email.trim(),
        password
      })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) return {
      ok: false,
      error: data?.error_description || data?.msg || "Грешка при регистрация."
    };
    // ако проектът изисква потвърждение на имейла, тук няма да има access_token —
    // акаунтът съществува, но не може да влезе, докато не кликне линка от писмото
    const needsConfirm = !data?.access_token;
    return {
      ok: true,
      needsConfirm
    };
  } catch (e) {
    return {
      ok: false,
      error: "Мрежова грешка при регистрация."
    };
  }
}
async function supabaseSignIn(email, password, url, key) {
  if (!url || !key) return {
    ok: false,
    error: "Няма връзка към Supabase (виж ⚙ Параметри)."
  };
  try {
    const res = await fetch(`${url}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: {
        apikey: key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data?.access_token) {
      return {
        ok: false,
        error: data?.error_description || data?.msg || "Грешен имейл или парола."
      };
    }
    return {
      ok: true,
      session: {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + (Number(data.expires_in) || 3600) * 1000,
        email: data.user?.email || email,
        displayName: data.user?.user_metadata?.display_name || "",
        role: data.user?.app_metadata?.role || "employee"
      }
    };
  } catch (e) {
    return {
      ok: false,
      error: "Мрежова грешка при вход."
    };
  }
}
async function supabaseRefreshSession(session, url, key) {
  if (!session?.refresh_token || !url || !key) return null;
  try {
    const res = await fetch(`${url}/auth/v1/token?grant_type=refresh_token`, {

      },

      access_token: data.access_token,
      refresh_token: data.refresh_token || session.refresh_token,
      expires_at: Date.now() + (Number(data.expires_in) || 3600) * 1000,
      email: data.user?.email || session.email,
      displayName: data.user?.user_metadata?.display_name || session.displayName || "",

// хедъри за заявки, които трябва да минат като логнат потребител (не анонимно) —

// "Забравена парола" — изпраща имейл с линк за възстановяване (работи с публичния anon

// потребителя тук с #access_token=...&type=recovery в адреса (виж parseRecoveryHash).
async function supabaseRecover(email, url, key) {

// чете #access_token=...&type=recovery от адреса след клик върху линка от писмото
function parseRecoveryHash() {
  const hash = window.location.hash || "";
  if (!hash.includes("type=recovery")) return null;
  const params = new URLSearchParams(hash.replace(/^#/, ""));
  const access_token = params.get("access_token");
  return access_token ? {
    access_token
  } : null;
}

// "" (изпразнено поле по средата на писане) не бива да замести число трайно —
// пази стойността по подразбиране, докато не дойде истинско ново число
function sanitizeNumericParams(obj, defaults) {
  const out = {
    ...obj
  };
  for (const key of Object.keys(defaults)) {
    const dv = defaults[key],
      v = out[key];
    if (typeof dv === "number") {
      if (v === "" || v == null || !Number.isFinite(Number(v))) out[key] = dv;
    } else if (dv && typeof dv === "object" && !Array.isArray(dv) && v && typeof v === "object" && !Array.isArray(v)) {
      out[key] = sanitizeNumericParams(v, dv);
    }
  }
  return out;
}

// сливане със стойностите по подразбиране, за да не се губят нови полета
function mergeParams(saved) {
  const d = structuredClone(DEFAULTS);
  if (!saved || typeof saved !== "object") return d;
  return sanitizeNumericParams({
    ...d,
    ...saved,
    truck: {
      ...d.truck,
      ...(saved.truck || {})
    },
    // само познатите прагове — старо "intercity: 350" от запазени настройки се игнорира
    landfillFees: {
      ...d.landfillFees,
      ...(saved.landfillFees || {})
    },
    minPrice: {
      local: saved.minPrice?.local ?? d.minPrice.local,
      international: saved.minPrice?.international ?? d.minPrice.international
    },
    crewTiers: saved.crewTiers || d.crewTiers,
    partnerTrucks: saved.partnerTrucks || d.partnerTrucks,
    bgDistances: {
      ...d.bgDistances,
      ...(saved.bgDistances || {})
    },
    boxPrices: {
      ...d.boxPrices,
      ...(saved.boxPrices || {})
    },
    euDistances: {
      ...d.euDistances,
      ...(saved.euDistances || {})
    },
    // адресът и ключът на базата идват САМО от кода, никога от запазени/изтеглени параметри:
    // иначе подменен ред в calc_params може да пренасочи входа (паролите) и записите към чужд сървър
    supabaseUrl: d.supabaseUrl,
    supabaseKey: d.supabaseKey
  }, d);
}
async function loadParams() {
  try {
    const val = await storageGet(PARAMS_KEY);
    return val ? mergeParams(JSON.parse(val)) : null;

// маха credentials от снапшота на параметрите преди запис в споделената база
function stripSecrets(p) {
  const {
    supabaseUrl,
    supabaseKey,
    mapsApiKey,
    ...safe
  } = p || {};
  return safe;
}

// изпраща записа към Supabase (споделена база), ако е зададена връзка
// isUpdate=true праща PATCH на съществуващ ред (не хаби пореден номер от bigserial
// последователността, за разлика от upsert — виж проекта: "защо в записите липсват номера")
// isUpdate=false (първи запис): молим базата да върне calc_number (return=representation),
// за да покажем на клиента СЪЩИЯ номер, който после се вижда в "Записи" — преди това картата
// показваше отделен, чисто локален брояч, който се разминаваше с номера в базата.
// touchStatus=false: обновява само данните (data), без да пипа status колоната — ползва се
// от рутинния автосейв, за да не смъква "потвърдена" обратно на "заявка"/"калкулация" само
// защото клиентът пипна нещо в калкулатора след като операторът вече е потвърдил офертата.
// Статусът се сменя изрично само при insert, "Изпрати заявка" и "Потвърди".
async function pushCalcToSupabase(record, url, key, isUpdate, touchStatus = true, session) {
  if (!url || !key || !record.id) return {
    ok: false
  };
  try {
    const res = isUpdate ? await fetch(`${url}/rest/v1/calculations?id=eq.${encodeURIComponent(record.id)}`, {
      method: "PATCH",
      headers: authHeaders(session, key, {
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      }),
      body: JSON.stringify(touchStatus ? {
        status: record.status || "калкулация",
        data: record
      } : {
        data: record
      })
    }) : await fetch(`${url}/rest/v1/calculations?on_conflict=id&select=calc_number`, {
      method: "POST",
      headers: authHeaders(session, key, {
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=representation"
      }),
      body: JSON.stringify({
        id: record.id,
        status: record.status || "калкулация",
        data: record
      })
    });
    if (!res.ok) return {
      ok: false
    };
    if (isUpdate) return {
      ok: true
    };
    const rows = await res.json().catch(() => null);
    return {
      ok: true,
      calcNumber: rows?.[0]?.calc_number ?? null
    };
  } catch (e) {
    console.error("supabase push failed", e);
    return {
      ok: false
    };
  }
}

// прибавя артикули от базата към съответната група на каталога, за да участват
// в изчисленията и интерфейса напълно наравно с вградените (по id в ITEM_INDEX)
function applyExtraCatalogItems(rows) {
  for (const row of rows || []) {
    if (!row || !row.id || ITEM_INDEX[row.id]) continue;
    const grp = CATALOG.find(g => g.group === row.group_name);
    if (!grp) continue;
    const item = {
      id: row.id,
      label: row.label,
      m3: Number(row.m3) || 0,
      kg: Number(row.kg) || 0,
      custom: true
    };
    grp.items.push(item);
    ITEM_INDEX[item.id] = item;
  }
}
const CALC_COUNTER_KEY = "counter:calc";

// поредните номера на калкулациите (обща бройка, споделена между устройствата)
async function nextCalcNumber() {
  try {
    const cur = await storageGet(CALC_COUNTER_KEY);
    const n = cur ? parseInt(cur, 10) || 0 : 0;
    const next = n + 1;
    await storageSet(CALC_COUNTER_KEY, String(next));
    return next;
  } catch (e) {
    return null; // без номер, ако хранилището не е налично
  }
}
async function saveCalc(key, record) {
  return storageSet(key, JSON.stringify(record));
}
async function loadCalcs(p, session) {
  if (p && p.supabaseUrl && p.supabaseKey) return fetchCalcsFromSupabase(p.supabaseUrl, p.supabaseKey, session);
  const out = [];
  const keys = await storageList(CALC_PREFIX);
  for (const k of keys) {
    try {
      const val = await storageGet(k);
      if (!val) continue;
      const rec = JSON.parse(val);
      // пропускаме всичко, което не е истинска калкулация (напр. служебни ключове)
      if (!rec || typeof rec !== "object" || !rec.createdAt || typeof rec.total !== "number") continue;
      out.push({
        key: k,
        ...rec
      });
    } catch (e) {/* пропускаме повреден запис */}
  }
  return out.sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
}
function toCSV(rows) {
  const head = ["№", "Заявка №", "Дата", "Услуга", "Град", "От", "До", "Км", "Обем м³", "Курсове", "Бригада", "Часове", "Цена €", "Марж €", "Марж %", "Име", "Телефон", "Имейл", "Статус", "Реални часове", "Реална цена €", "Бележка реални"];
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const body = rows.map(r => [r.calcNumber ?? "", r.requestNumber || "", new Date(r.createdAt).toLocaleString("bg-BG"), r.service, r.city || r.destination || "", r.from || "", r.to || "", r.km, r.volumeM3, r.trips, r.crew, r.hours, r.total, r.margin ?? "", r.marginPercent ?? "", r.contact?.name || "", r.contact?.phone || "", r.contact?.email || "", r.status, r.actual?.hours ?? "", r.actual?.price ?? "", r.actual?.note || ""].map(esc).join(","));
  return [head.map(esc).join(","), ...body].join("\n");
}
