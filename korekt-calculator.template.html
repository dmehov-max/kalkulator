<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корект — калкулатор за приблизителна цена</title>
<meta name="description" content="Изчислете приблизителната цена на Вашето преместване — Корект преместване ООД">
<meta http-equiv="Content-Security-Policy" content="/*__CSP__*/">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>
/* Защита от вграждане в чужд сайт (clickjacking): GitHub Pages не позволява заглавката
   frame-ancestors, затова страницата сама отказва да работи в рамка на друг адрес. */
if (window.top !== window.self) { document.documentElement.style.display = "none"; window.top.location = window.self.location.href; }
</script>
<!-- Библиотеките са копие в папка vendor/ с фиксирана версия (не от чужд CDN при всяко зареждане),
     виж vendor/README.md. Целостта им се проверява от build.mjs и security.test.mjs. -->
<script src="vendor/tailwind-play-3.4.17.js"></script>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style> body { margin:0; font-family:'Fira Sans',system-ui,sans-serif; } </style>
</head>
<body>
<div id="root"></div>

<script>
/* --- Пазене на настройки и калкулации в браузъра на устройството ---
   В сайта няма хранилището на Claude, затова ползваме localStorage.
   Общата база остава Google Sheet (адресът се задава в ⚙ Параметри). */
window.storage = {
  async get(key) {
    const v = localStorage.getItem("korekt:" + key);
    if (v === null) throw new Error("not found");
    return { key: key, value: v, shared: true };
  },
  async set(key, value) {
    localStorage.setItem("korekt:" + key, value);
    return { key: key, value: value, shared: true };
  },
  async delete(key) {
    localStorage.removeItem("korekt:" + key);
    return { key: key, deleted: true, shared: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("korekt:") === 0) {
        const bare = k.slice(7);
        if (!prefix || bare.indexOf(prefix) === 0) keys.push(bare);
      }
    }
    return { keys: keys, prefix: prefix, shared: true };
  }
};
</script>

<script>
/*__APP__*/
</script>
</body>
</html>
