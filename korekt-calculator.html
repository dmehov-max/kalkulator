/* --- Пазене на настройки и калкулации в браузъра на устройството ---
   В сайта няма хранилището на Claude, затова ползваме localStorage.
   Общата база остава Google Sheet (адресът се задава в ⚙ Параметри). */
window.storage = {
  async get(key) {
    const v = localStorage.getItem("korekt:" + key);
    if (v === null) throw new Error("not found");
    return { key: key, value: v, shared: true };
  },
  async set(key, value) {
    localStorage.setItem("korekt:" + key, value);
    return { key: key, value: value, shared: true };
  },
  async delete(key) {
    localStorage.removeItem("korekt:" + key);
    return { key: key, deleted: true, shared: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("korekt:") === 0) {
        const bare = k.slice(7);
        if (!prefix || bare.indexOf(prefix) === 0) keys.push(bare);
      }
    }
    return { keys: keys, prefix: prefix, shared: true };
  }
};
</script>

const ITEM_INDEX = Object.fromEntries(CATALOG.flatMap(g => g.items).map(i => [i.id, i]));
// латиница → кирилица не се прави еднозначно, затова вървим обратно: транслитерираме
// кирилските етикети към латиница по официалната БГ транслитерация и сравняваме с нея,
// за да намираме "hladilnik" при търсене на "Хладилник"
const BG_TRANSLIT = {
  а: "a",
  б: "b",
  в: "v",
  г: "g",
  д: "d",
  е: "e",
  ж: "zh",
  з: "z",

  ю: "yu",
  я: "ya"
};
function translitBG(str) {
  return String(str || "").toLowerCase().split("").map(ch => BG_TRANSLIT[ch] ?? ch).join("");
}

// проста, но достатъчна валидация за контактната форма — не претендира за пълна RFC точност,
// само хваща очевидно грешно въведени данни (напр. "not-an-email")
const isValidEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || "").trim());
const isValidPhone = v => {
  const digits = String(v || "").replace(/[\s\-()]/g, "");
  return /^\+?\d{6,15}$/.test(digits);
};
const totalVolume = qty => Object.entries(qty).reduce((s, [id, cnt]) => s + (ITEM_INDEX[id]?.m3 || 0) * cnt, 0);
// часове за разглобяване и за сглобяване (по отделни отметки на вещ)
// Отметките dis/asm може да са:
//   true  → всички бройки от вещта (обратна съвместимост)
//   число → само толкова бройки (напр. 4 бюра, но само 1 се разглобява)
//   false/липсва → нищо
const pickCount = (flag, cnt) => {
  if (flag === true) return cnt;
  const n = Number(flag);
  if (Number.isFinite(n) && n > 0) return Math.min(n, cnt);
  return 0;
};
const disHoursFor = (qty, dis, asm, factor) => {
  let d = 0,
    a = 0;
  for (const [id, cnt] of Object.entries(qty)) {
    const it = ITEM_INDEX[id];
    if (!it || !cnt) continue;
    if (it.dis) d += it.dis * pickCount(dis?.[id], cnt);
    if (it.asm) a += it.asm * pickCount(asm?.[id], cnt);
  }
  const k = factor || 1;
  return {
    dis: d * k,
    asm: a * k,
    total: (d + a) * k
  };
};

// метри твърда защита (велпапе / автопласт) — за чупливи повърхности
const protectMetersFor = (qty, protect) => Object.entries(qty).reduce((s, [id, cnt]) => {
  const it = ITEM_INDEX[id];
  if (!it?.protect || !cnt) return s;
  const n = it.protectReq ? cnt : pickCount(protect?.[id], cnt);
  return s + it.protect * n;
}, 0);

// метри стреч фолио: задължителните вещи винаги, останалите — по избор
const wrapMetersFor = (qty, wrap) => Object.entries(qty).reduce((s, [id, cnt]) => {
  const it = ITEM_INDEX[id];
  if (!it?.wrap || !cnt) return s;
  // задължителните се опаковат всички; за останалите важи избраният брой
  const n = it.wrapReq ? cnt : pickCount(wrap?.[id], cnt);
  return s + it.wrap * n;
}, 0);
const totalWeight = qty => Object.entries(qty).reduce((s, [id, cnt]) => s + (ITEM_INDEX[id]?.kg || 0) * cnt, 0);
const countKind = (qty, kind) => Object.entries(qty).reduce((s, [id, cnt]) => s + (ITEM_INDEX[id]?.kind === kind ? cnt : 0), 0);
// вещи без изрична категория (кашон/уред/едрогабаритно) — "обикновена мебел":
// гардероби, легла, маси, столове и пр. Носят се по стълби също като уредите.
const FLOOR_FEE_KINDS = new Set(["box", "sack", "appliance", "appliance_heavy", "oversized"]);
const countFurniture = qty => Object.entries(qty).reduce((s, [id, cnt]) => {
  const it = ITEM_INDEX[id];
  return s + (it && cnt > 0 && !FLOOR_FEE_KINDS.has(it.kind) ? cnt : 0);
}, 0);

function haversineKm(a, b) {
  const R = 6371,
    toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat),
    dLng = toR(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
// нормализация: маха "кв.", "ж.к.", "с.", "гр.", регистър и излишни интервали
function normHood(x) {
  return String(x || "").toLowerCase().trim().replace(/^(кв\.?|ж\.?к\.?|жк|с\.?|гр\.?)\s+/i, "").replace(/\s+/g, " ");
}
function findHood(city, name) {
  const list = NEIGHBORHOODS[city];
  if (!list || !name) return null;
  const q = normHood(name);
  if (!q) return null;
  return list.find(x => normHood(x.name) === q) || list.find(x => normHood(x.name).startsWith(q)) || list.find(x => normHood(x.name).includes(q)) || null;
}
function cityCenter(city) {
  const list = NEIGHBORHOODS[city];
  if (list) return list.find(x => x.name === "Център") || list[0];
  return typeof CITIES !== "undefined" && CITIES[city] ? CITIES[city] : null;
}
// Непознат квартал НЕ блокира: смята се спрямо центъра на града.
function estimateKm(city, aName, bName, roadFactor) {
  const list = NEIGHBORHOODS[city];
  if (!list || !aName || !bName) return null;
  const center = cityCenter(city);
  const a = findHood(city, aName) || center;
  const b = findHood(city, bName) || center;
  if (!a || !b) return null;
  return Math.max(2, Math.round(haversineKm(a, b) * roadFactor));
}

// намира град по непълно/неточно въведено име
function findCity(name) {
  const q = normHood(name);
  if (!q) return null;
  const keys = Object.keys(CITIES);
  return keys.find(c => normHood(c) === q) || keys.find(c => normHood(c).startsWith(q)) || keys.find(c => normHood(c).includes(q)) || null;
}

// точка за изчисление: първо квартал в града, после самият град
function pointFor(city, hood) {
  const h = findHood(city, hood);
  if (h) return h;
  const c = cityCenter(city);
  if (c) return c;
  const match = findCity(city);
  return match ? CITIES[match] : null;
}

// разстояние между кои да е две точки в страната
// Градове, в които Корект има екипи
const BASES = ["София", "Пловдив", "Варна", "Бургас", "Русе", "Велико Търново"];
function nearestBase(city, roadFactor) {
  let best = null,
    bestKm = Infinity;
  for (const b of BASES) {
    const km = estimateKmAny(b, "", city, "", roadFactor);
    if (km != null && km < bestKm) {
      best = b;
      bestKm = km;
    }
  }
  return best ? {
    city: best,
    km: bestKm
  } : null;
}

// базата е "на маршрута", ако отклонението през нея е под допустимото
function baseOnRoute(from, base, to, roadFactor, tolerance) {
  const direct = estimateKmAny(from, "", to, "", roadFactor);
  const a = estimateKmAny(from, "", base, "", roadFactor);
  const b = estimateKmAny(base, "", to, "", roadFactor);
  if (direct == null || a == null || b == null) return false;
  return a + b <= direct * (tolerance || 1.1);
}

/* Реални пътни разстояния (км, еднопосочно) за маршрути, където изчислението
   по права линия се разминава — напр. планински обходи. Имат превес над формулата.
   Посоката няма значение — записвай ги в какъвто ред е удобно. */
const REAL_DISTANCES_RAW = {
  "София|Банско": 160
};
function realDistanceKey(a, b) {
  return [a, b].sort((x, y) => x.localeCompare(y, "bg")).join("|");
}

// нормализираме ключовете веднъж, за да е без значение в какъв ред са записани
const REAL_DISTANCES = Object.fromEntries(Object.entries(REAL_DISTANCES_RAW).map(([k, v]) => {
  const [a, b] = k.split("|");
  return [realDistanceKey(a, b), v];
}));
function lookupRealDistance(cityA, cityB) {
  if (!cityA || !cityB) return null;
  const direct = REAL_DISTANCES[realDistanceKey(cityA, cityB)];
  if (direct != null) return direct;
  // толерантно спрямо непълно въведени имена
  const a = findCity(cityA),
    b = findCity(cityB);
  if (!a || !b) return null;
  const viaMatch = REAL_DISTANCES[realDistanceKey(a, b)];
  return viaMatch != null ? viaMatch : null;
}

/* --- Реални разстояния през Google Routes API (по избор) ---------------
   Ако е зададен ключ в ⚙ Параметри, калкулаторът пита Google за реалния
   маршрут по път. Резултатите се кешират, за да не се хабят заявки. */
const routesCache = new Map();
const ROUTES_CACHE_KEY = "cache:routes";
let routesCacheLoaded = false;

// зареждаме запомнените разстояния от хранилището (веднъж при стартиране)
async function loadRoutesCache() {
  if (routesCacheLoaded) return;
  routesCacheLoaded = true;
  try {
    const raw = await storageGet(ROUTES_CACHE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    for (const [k, v] of Object.entries(obj)) {
      if (!routesCache.has(k)) routesCache.set(k, v);
    }
  } catch (e) {/* без кеш — просто ще питаме Google наново */}
}
async function persistRoutesCache() {
  try {
    await storageSet(ROUTES_CACHE_KEY, JSON.stringify(Object.fromEntries(routesCache)));
  } catch (e) {/* не е критично */}
}
function routesCacheKey(a, b) {
  return [a, b].sort((x, y) => x.localeCompare(y, "bg")).join("|");
}
async function fetchRealDistanceKm(cityA, cityB, apiKey) {
  if (!apiKey || !cityA || !cityB) return null;
  // Google не разпознава кирилски адрес низове ("София, България" → "Address not found") —
  // пращаме координати вместо адрес, което е и по-точно, и работи без значение от езика.
  const ptA = CITIES[cityA] || CITIES[findCity(cityA)];
  const ptB = CITIES[cityB] || CITIES[findCity(cityB)];
  if (!ptA || !ptB) return null;
  const ck = routesCacheKey(cityA, cityB);
  if (routesCache.has(ck)) return routesCache.get(ck);
  try {
    const res = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": apiKey,
        "X-Goog-FieldMask": "routes.distanceMeters,routes.description"
      },
      body: JSON.stringify({
        origin: {
          location: {
            latLng: {
              latitude: ptA.lat,
              longitude: ptA.lng
            }
          }
        },
        destination: {
          location: {
            latLng: {
              latitude: ptB.lat,
              longitude: ptB.lng
            }
          }
        },
        travelMode: "DRIVE",
        routingPreference: "TRAFFIC_UNAWARE",
        // без трафик — стабилен резултат
        computeAlternativeRoutes: true // питаме за няколко варианта
      })
    });
    if (!res.ok) return null;
    const data = await res.json();
    const routes = (data?.routes || []).filter(r => r.distanceMeters);
    if (!routes.length) return null;
    // взимаме най-краткия вариант, не най-бързия
    const best = routes.reduce((a, b) => a.distanceMeters <= b.distanceMeters ? a : b);
    const km = Math.round(best.distanceMeters / 1000);
    const info = {
      km,
      via: best.description || null,
      source: "google"
    };
    routesCache.set(ck, info);
    persistRoutesCache(); // запомняме трайно, за да не питаме Google пак
    return info;
  } catch (e) {
    return null; // при проблем си остава изчислението по формулата
  }
}

// Откъде идва разстоянието за този маршрут — за прозрачност в офертата
function distanceSourceInfo(cityA, cityB) {
  if (!cityA || !cityB) return null;
  if (lookupRealDistance(cityA, cityB) != null) {
    return {
      source: "manual",
      label: "ръчно заложено разстояние"
    };
  }
  const a = findCity(cityA),
    b = findCity(cityB);

    if (cached && typeof cached === "object") {
      return {

        via: cached.via

// Линк към Google Maps за визуална проверка на маршрута
function mapsLink(cityA, cityB) {
  if (!cityA || !cityB) return null;

}
function estimateKmAny(cityA, hoodA, cityB, hoodB, roadFactor) {
  // 1) ръчно заложено реално разстояние (най-висок приоритет)
  const real = lookupRealDistance(cityA, cityB);
  if (real != null) return real;
  // 2) вече изтеглено от Google Routes API
  const a0 = findCity(cityA),
    b0 = findCity(cityB);
  if (a0 && b0) {

    if (cached != null) return typeof cached === "object" ? cached.km : cached;
  }
  // 3) изчисление по права линия
  const a = pointFor(cityA, hoodA),
    b = pointFor(cityB, hoodB);

}
const n = v => Number.isFinite(Number(v)) ? Number(v) : 0;
// закръгля показаните/таксувани часове нагоре до половин час: 0.4→0.5, 1.2→1.5, 1.6→2
const roundHalf = h => Math.ceil(n(h) * 2) / 2;
const crewFor = (vol, p) => (p.crewTiers.find(t => vol <= t.maxM3) || {
  crew: 4
}).crew;
function ownTruck(p) {
  return {
    id: "own",
    name: `Собствен ${n(p.truck.l)}×${n(p.truck.w)}×${n(p.truck.h)} м`,
    cap: n(p.truck.l) * n(p.truck.w) * n(p.truck.h) * n(p.fillFactor),
    payloadKg: n(p.truck.payloadKg || 1500),
    kmRate: n(p.kmRate)
  };
}
function partnersOf(p) {
  return (p.partnerTrucks || []).map(t => ({
    id: t.id,
    name: t.name,
    cap: n(t.capacity) * n(p.fillFactor),
    payloadKg: n(t.payloadKg || 3500),
    kmRate: t.kmRate != null && t.kmRate !== "" ? n(t.kmRate) : n(p.kmRate)
  }));
}
function fleetFor(service, p, wasteType) {
  const own = ownTruck(p);
  if (service === "local") return [own];
  if (service === "disposal") {
    const all = [own, ...partnersOf(p)];
    // изхвърляне на отпадък (от градски адрес) — само малки камиони, не ТИР
    const limit = n(p.disposalMaxPayloadKg || 3500);
    const small = all.filter(t => t.payloadKg <= limit);
    return small.length ? small : [own];
  }
  const partners = (p.partnerTrucks || []).map(t => ({
    id: t.id,
    name: t.name,
    cap: n(t.capacity) * n(p.fillFactor),
    payloadKg: n(t.payloadKg || 3500),
    kmRate: t.kmRate != null && t.kmRate !== "" ? n(t.kmRate) : n(p.kmRate)
  }));

}
// курсовете се определят от това, което свърши първо — обемът или тежестта
const tripsFor = (vol, cap, weight, payload) => {
  const byVol = vol > 0 && cap > 0 ? Math.ceil(vol / cap) : 0;
  const byKg = weight > 0 && payload > 0 ? Math.ceil(weight / payload) : 0;
  return Math.max(byVol, byKg);
};
function bestTruck(fleet, vol, weight) {
  let best = null,
    bestMetric = Infinity,
    bestTrips = Infinity;
  for (const t of fleet) {
    const tr = tripsFor(vol, t.cap, weight, t.payloadKg);
    if (!tr) continue;
    const metric = tr * t.kmRate; // минимизираме транспортната цена
    if (metric < bestMetric - 1e-9 || Math.abs(metric - bestMetric) < 1e-9 && tr < bestTrips) {
      best = t;
      bestMetric = metric;
      bestTrips = tr;
    }
  }
  return best || fleet[0];
}

/* -------- ценови двигател -------- */
function computePrice(s, p) {
  const lines = [];
  let total = 0;
  // precise = дребните пера (материали) се показват с точност до стотинка
  const add = (label, amount, precise) => {
    if (!amount) return;
    total += amount;
    lines.push({
      label,
      amount: precise ? Math.round(amount * 100) / 100 : Math.round(amount)
    });
  };
  const vol = totalVolume(s.qty);
  const weight = totalWeight(s.qty);
  const wasteType = s.wasteType || "household";

  // избор на камион
  const fleet = fleetFor(s.service, p, s.wasteType);
  const picked = s.truckId ? fleet.find(t => t.id === s.truckId) : null;
  const chosen = picked || bestTruck(fleet, vol, weight);
  const cap = chosen ? chosen.cap : 0;
  const payload = chosen ? chosen.payloadKg : 0;
  const trips = tripsFor(vol, cap, weight, payload);
  // кое ограничава — обемът или тежестта
  const tripsByVol = cap > 0 && vol > 0 ? Math.ceil(vol / cap) : 0;
  const tripsByKg = payload > 0 && weight > 0 ? Math.ceil(weight / payload) : 0;
  const weightLimited = tripsByKg > tripsByVol;

  // разстояние (еднопосочно) и бригада
  const localEst = s.service === "local" ? NEIGHBORHOODS[s.city] ? estimateKm(s.city, s.pickupHood, s.dropoffHood, n(p.cityRoadFactor || 1.3)) : s.city ? n(p.defaultTownKm || 4) : null : null;
  // междуградско: смята се от център до център на градовете (без квартали)
  const bgEst = s.service === "intercity" ? estimateKmAny(s.pickupCity, "", s.dropoffCity, "", n(p.roadFactorBG || 1.25)) : null;
  const autoOneWayKm = s.service === "local" ? localEst != null ? localEst : 0 : s.service === "intercity" ? bgEst != null ? bgEst : n(s.km) : n(p.euDistances[s.country]);
  // ръчна промяна на километрите (напр. служителят знае по-точен маршрут) — важи за всички услуги
  const kmManual = Number(s.kmOverride) > 0;
  const oneWayKm = kmManual ? Number(s.kmOverride) : autoOneWayKm;
  let crew = crewFor(vol, p);
  const autoCrew = crew; // изчисленият по обем брой — за справка в интерфейса
  // протокол: някои вещи изискват минимален брой хора (напр. двуврат хладилник → 4)
  let reqCrew = 0;
  Object.entries(s.qty).forEach(([id, cnt]) => {
    if (cnt > 0 && ITEM_INDEX[id]?.minCrew) reqCrew = Math.max(reqCrew, ITEM_INDEX[id].minCrew);
  });
  const crewByProtocol = reqCrew > crew;
  if (reqCrew) crew = Math.max(crew, reqCrew);

  // ръчна промяна от служител — не може под изисквания от протокола минимум
  const manualCrew = Number(s.crewOverride) || 0;
  const crewManual = manualCrew > 0 && manualCrew !== crew;
  if (manualCrew > 0) crew = Math.max(manualCrew, reqCrew || 1);

  // курс = разстояние над прага; далечни "градски" адреси също минават на км тарифа
  const isDisposalService = s.service === "disposal";
  const isLabourOnly = s.service === "labour"; // само хамали, клиентът осигурява транспорт
  const isAssembly = s.service === "assembly"; // монтаж на мебели, без пренасяне/транспорт на стоки
  const isTRD = s.service === "trd"; // товаро-разтоварна дейност на тир/камион на едно място
  // и трите: наши хора пътуват до адрес/обект, часовете се въвеждат ръчно от служителя
  const isManualHoursService = isAssembly || isTRD;
  const usesFieldCrew = isLabourOnly || isManualHoursService;

  // При работа на бригада в друг град: тръгва от избрана или най-близката база.
  // Ако е в самия град на базата, няма път и няма кола.
  const labourAutoBase = usesFieldCrew && s.city ? nearestBase(s.city, n(p.roadFactorBG || 1.25)) : null;
  const labourBaseCity = usesFieldCrew ? s.labourBase || labourAutoBase?.city || null : null;
  const labourBaseKm = labourBaseCity && s.city ? estimateKmAny(labourBaseCity, "", s.city, "", n(p.roadFactorBG || 1.25)) : 0;
  const labourTravelKm = labourBaseKm && labourBaseKm > n(p.labourLocalRadiusKm || 15) ? labourBaseKm : 0;
  const isCourse = !isDisposalService && !usesFieldCrew && oneWayKm >= n(p.intercityThresholdKm);

  // екстри (човекочаса) — достъпът по стълби вече е парична такса, не часове
  const work = disHoursFor(s.qty, s.dis, s.asm, n(p.disFactor || 1));
  // разглобяването и сглобяването се правят от РАЗЛИЧНИ екипи — броят се поотделно
  const disCrew = n(p.disCrew || 2);
  const asmCrew = n(p.asmCrew || 2);
  const disAsmRate = n(p.disAsmRate || p.workerRate); // квалифициран труд — отделна ставка
  const disOnlyHours = work.dis; // реални часове разглобяване
  const asmOnlyHours = work.asm; // реални часове сглобяване
  const disOnlyManHours = disOnlyHours * disCrew;
  const asmOnlyManHours = asmOnlyHours * asmCrew;
  const disHours = disOnlyHours + asmOnlyHours; // общо реално време
  const disManHours = disOnlyManHours + asmOnlyManHours;

  // опаковане със стреч: метри → часове труд + ролки материал
  const wrapMeters = wrapMetersFor(s.qty, s.wrap);
  const wrapManHours = wrapMeters / n(p.wrapMPerManHour || 40);
  const wrapHours = wrapManHours; // човекочаса за опаковане
  const rolls = wrapMeters > 0 ? wrapMeters / n(p.stretchRollM || 20) : 0; // дробна част се таксува пропорционално

  // велпапе / автопласт за огледала, картини, стъкла
  const protectMeters = protectMetersFor(s.qty, s.protect);
  const protectManHours = protectMeters / n(p.protectMPerManHour || 25);

  // ИЗХВЪРЛЯНЕ: разстояние до сметището, пълнене на чували, тонаж
  const isDisposal = s.service === "disposal";
  const sacks = countKind(s.qty, "sack");
  const fillManHours = isDisposal && s.weFill ? sacks * n(p.fillMinPerSack) / 60 : 0;
  const tons = weight / 1000;
  const landfillKm = n(s.landfillKm || p.landfillKm);

  // ПЪТ: градско = еднопосочно; изхвърляне = до сметището и обратно; извънградско = двупосочно
  // междуградско е ВИНАГИ двупосочно (камионът се връща до базата), дори под прага от 50 км;
  // само истинското градско (в рамките на града) остава еднопосочно.
  const rtFactor = s.service === "local" ? 1 : n(p.roundTripFactor);
  const totalKm = trips * rtFactor * (isDisposal ? landfillKm : oneWayKm);
  const speed = isCourse ? n(p.roadSpeed || 65) : n(p.citySpeed || 30);
  const driveHours = speed ? totalKm / speed : 0;

  // 1) ПРЕНАСЯНЕ И ПЪТ — това е времето, в което камионът е ангажиран
  let handlingClock; // реални часове
  let fillClockElapsed = 0; // отделно календарно време за пълнене на чували (изхвърляне)
  let disposalTotalCrew = 0; // общ брой хора за изхвърляне (след таван), за показване в интерфейса
  const disposalTrucksN = s.service === "disposal" ? Math.max(1, Math.round(n(s.disposalTrucks || 1))) : 1;
  const minCrewH = n(p.minCrewHours || 2);
  const loadClock = Math.max(n(p.loadHours) * trips, minCrewH); // мин. 2 ч на изпратена бригада
  const unloadClock = Math.max(n(p.unloadHours) * trips, minCrewH);
  if (isCourse) {
    handlingClock = loadClock + unloadClock;
  } else {
    // товарене (при адреса на извозване) и разтоварване (на адреса на доставка) — на курсове,
    // с добавка на етаж без асансьор. При партер/асансьор дава същия резултат като старата
    // формула vol/m3PerManHour; стълбите винаги добавят време отгоре, никога не го намаляват.
    const pickupNoElevFloors = s.pickup.floor >= 1 && !s.pickup.elevator ? s.pickup.floor : 0;
    const dropoffNoElevFloors = s.dropoff.floor >= 1 && !s.dropoff.elevator ? s.dropoff.floor : 0;
    const stairsTripM3 = n(p.stairsTripM3 || 0.4);
    const stairsHourPerFloorTrip = n(p.stairsMinPerFloorTrip || 1.5) / 60;
    const perTripBaseHours = stairsTripM3 / n(p.m3PerManHour || 1.6); // = базовата производителност при 0 етажа

    const legClock = (volPortion, floors) => {
      const trips = volPortion > 0 ? Math.ceil(volPortion / stairsTripM3) : 0;
      return trips * (perTripBaseHours + floors * stairsHourPerFloorTrip) / crew;
    };
    const loadCarryClock = legClock(vol / 2, pickupNoElevFloors);
    const unloadCarryClock = legClock(vol / 2, dropoffNoElevFloors);
    handlingClock = loadCarryClock + unloadCarryClock + driveHours;
    if (handlingClock < n(p.minLocalHours)) handlingClock = n(p.minLocalHours); // мин 2 ч
  }
  // ръчна промяна на часовете на курса (напр. служителят знае реалния престой) — заменя изчисленото
  const autoHandlingClock = handlingClock;
  const hoursManual = Number(s.hoursOverride) > 0;
  if (hoursManual) handlingClock = Number(s.hoursOverride);
  // при курс с пътуваща бригада вторият човек се плаща за РЕАЛНИТЕ часове (път + работа) × часова ставка,
  // без таван — 10 часа = 10 × ставката, 12 часа = 12 × ставката и т.н.
  const dayTotalH = handlingClock + driveHours;
  const travelDays = isCourse ? Math.max(1, Math.ceil(dayTotalH / n(p.dayHours || 10))) : 0; // само за информация
  const dayCrewMode = isCourse && s.courseMode === "dayCrew";
  const localCrewMode = isCourse && s.courseMode === "localCrew";
  const selfUnloadMode = isCourse && s.courseMode === "selfUnload"; // клиентът разтоварва сам

  // База с екип за разтоварване (вариант 2) — автоматично най-близката или ръчно избрана
  const autoBase = localCrewMode ? nearestBase(s.dropoffCity, n(p.roadFactorBG || 1.25)) : null;
  const baseCity = localCrewMode ? s.baseCity || autoBase?.city || null : null;
  const baseKm = baseCity ? estimateKmAny(baseCity, "", s.dropoffCity, "", n(p.roadFactorBG || 1.25)) : 0;
  const baseIsOnRoute = baseCity ? baseOnRoute(s.pickupCity, baseCity, s.dropoffCity, n(p.roadFactorBG || 1.25), n(p.routeDetourTolerance || 1.1)) : false;
  // кола трябва, ако базата е встрани от маршрута ИЛИ служителят я е поискал изрично
  const needCar = !!baseCity && (!baseIsOnRoute || !!s.forceCar);

  // реални разходи, платени "на трето лице" за материали/превоз (кола, стреч, велпапе,
  // чували, такса сметище) — начисляват се на клиента почти на себестойност, но без тях
  // маржът в панел "Марж" излизаше завишен, все едно е чиста печалба
  let extraCostTotal = 0;
  let handlingManHours;
  if (dayCrewMode) {
    handlingManHours = 0; // трудът се плаща на ден, не на час
    const people = n(p.travelCrew || 1);
    add(`Придружаващ работник — ${dayTotalH.toFixed(1)} ч × ${people} ${people === 1 ? "човек" : "души"} × ${n(p.workerRate)} ${p.currency}/ч`, dayTotalH * people * n(p.workerRate));
  } else if (localCrewMode) {
    // товаренето при клиента + местна бригада, която пътува до адреса и разтоварва
    handlingManHours = loadClock * crew;
    add(`Товарене (${s.pickupCity}) — ${loadClock.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, handlingManHours * n(p.workerRate));
    const crewDriveH = baseKm ? 2 * baseKm / n(p.roadSpeed || 65) : 0; // отиване и връщане
    const crewWorkH = Math.max(n(p.unloadHours) * trips, n(p.localCrewMinHours || 2)); // мин. 2 ч работа
    const crewHours = crewDriveH + crewWorkH;
    const people = n(p.localCrewSize || 2);
    add(`Местна бригада ${baseCity ? `(${baseCity})` : ""} — ${crewWorkH.toFixed(1)} ч работа + ${crewDriveH.toFixed(1)} ч път × ${people} души × ${n(p.workerRate)} ${p.currency}/ч`, crewHours * people * n(p.workerRate));
    handlingManHours += crewHours * people;
    if (baseCity && needCar) {
      const fee = 2 * baseKm * n(p.carRatePerKm);
      add(`Кола ${baseCity} → ${s.dropoffCity} — ${2 * baseKm} км × ${n(p.carRatePerKm)} ${p.currency}/км`, fee, true);
      extraCostTotal += fee;
    }
  } else if (isDisposal) {
    // изнасяне + път до сметището и обратно + изсипване
    // При няколко камиона, работещи паралелно, общата работа (и цена) е същата,
    // но календарното време се дели на броя камиони/екипи.
    // Общият брой хора е ограничен (напр. Варна — макс. 8 души на разположение).
    const trucksN = disposalTrucksN;
    const disposalRate = n(p.disposalWorkerRate || p.workerRate);
    const maxWorkers = n(p.disposalMaxWorkers || 8);
    const totalCrew = Math.min(crew * trucksN, maxWorkers);
    disposalTotalCrew = totalCrew;
    fillClockElapsed = fillManHours / totalCrew; // реално време за пълнене, ако помагат всички
    const carryClock = vol / n(p.m3PerManHour || 1) / totalCrew;
    const dumpClockTotal = trips * n(p.dumpHoursPerTrip);
    const driveHoursElapsed = driveHours / trucksN; // driveHours е общо за всички курсове
    const dumpClockElapsed = dumpClockTotal / trucksN;
    let jobClock = carryClock + driveHoursElapsed + dumpClockElapsed;
    if (jobClock < n(p.minDisposalHours)) jobClock = n(p.minDisposalHours);
    handlingClock = jobClock; // само престоят на камиона — за него се таксува транспортът
    handlingManHours = jobClock * totalCrew;
    if (fillManHours) {
      const h = roundHalf(fillManHours);
      add(`Пълнене на ${sacks} чувала — ${h.toFixed(1)} чч × ${disposalRate} ${p.currency}/ч`, h * disposalRate);
    }
    if (sacks > 0) {
      const fee = sacks * n(p.sackPrice);
      add(`Чували — ${sacks} бр. × ${n(p.sackPrice)} ${p.currency}/бр.`, fee, true);
      extraCostTotal += fee;
    }
    {
      const h = roundHalf(jobClock);
      add(`Изнасяне, извозване и изсипване${trucksN > 1 ? ` (${trucksN} камиона)` : ""} — ${h.toFixed(1)} ч × ${totalCrew} души × ${disposalRate} ${p.currency}/ч`, h * totalCrew * disposalRate);
    }
  } else if (isLabourOnly) {
    // само хамали — клиентът осигурява транспорта за багажа.
    // Ако работата е в друг град, се плаща кола за хората + времето за път.
    const carryClock = vol / n(p.m3PerManHour || 1.6) / crew;
    let jobClock = carryClock;
    if (jobClock < n(p.minLocalHours)) jobClock = n(p.minLocalHours); // мин. 2 ч

    // разстояние от базата до града на работа (0, ако е в същия град)
    const labourKm = labourTravelKm;
    const travelH = labourKm ? 2 * labourKm / n(p.roadSpeed || 65) : 0; // отиване и връщане

    handlingClock = jobClock + travelH;
    handlingManHours = handlingClock * crew;
    {
      const h = roundHalf(jobClock);
      add(`Товарене и пренасяне — ${h.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, h * crew * n(p.workerRate));
    }
    if (travelH > 0) {
      const h = roundHalf(travelH);
      add(`Път на бригадата (${labourBaseCity} → ${s.city}) — ${h.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, h * crew * n(p.workerRate));
    }
    // кола за бригадата — винаги, с минимална такса дори в рамките на града
    const carKmFee = labourKm ? 2 * labourKm * n(p.carRatePerKm) : 0;
    const carFee = Math.max(carKmFee, n(p.labourMinCarFee || 0));
    if (carFee > 0) {
      add(labourKm ? `Кола за бригадата — ${2 * labourKm} км × ${n(p.carRatePerKm)} ${p.currency}/км` : `Кола за бригадата (в града) — минимална такса`, carFee, true);
      extraCostTotal += carFee;
    }
  } else if (isManualHoursService) {
    // монтаж на мебели / ТРД — часовете се въвеждат ръчно от служителя (по преценка на място),
    // не се смятат от обем. Пътят на бригадата и колата работят по същия начин като "Само хамали".
    const jobClock = Math.max(n(s.manualHours || 0), n(p.minLocalHours));
    const labourKm = labourTravelKm;
    const travelH = labourKm ? 2 * labourKm / n(p.roadSpeed || 65) : 0;
    handlingClock = jobClock + travelH;
    handlingManHours = handlingClock * crew;
    const jobRate = isAssembly ? disAsmRate : n(p.workerRate); // монтажът е квалифициран труд
    {
      const h = roundHalf(jobClock);
      add(`${isAssembly ? "Монтаж на мебели" : "Товарене/разтоварване"} — ${h.toFixed(1)} ч × ${crew} души × ${jobRate} ${p.currency}/ч`, h * crew * jobRate);
    }
    if (travelH > 0) {
      const h = roundHalf(travelH);
      add(`Път на бригадата (${labourBaseCity} → ${s.city}) — ${h.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, h * crew * n(p.workerRate));
    }
    const carKmFee = labourKm ? 2 * labourKm * n(p.carRatePerKm) : 0;
    const carFee = Math.max(carKmFee, n(p.labourMinCarFee || 0));
    if (carFee > 0) {
      add(labourKm ? `Кола за бригадата — ${2 * labourKm} км × ${n(p.carRatePerKm)} ${p.currency}/км` : `Кола за бригадата (в града) — минимална такса`, carFee, true);
      extraCostTotal += carFee;
    }
  } else if (selfUnloadMode) {
    // клиентът разтоварва сам — плаща се само товаренето при него
    handlingManHours = loadClock * crew;
    handlingClock = loadClock;
    {
      const h = roundHalf(loadClock);
      add(`Товарене (${s.pickupCity}) — ${h.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, h * crew * n(p.workerRate));
    }
  } else {
    handlingManHours = handlingClock * crew;
    if (hoursManual) {
      // ръчно зададени часове — един общ ред вместо автоматичното разделяне на товарене/разтоварване
      const h = roundHalf(handlingClock);
      add(`Товарене и разтоварване (ръчно) — ${h.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, h * crew * n(p.workerRate));
    } else if (isCourse) {
      const hL = roundHalf(loadClock),
        hU = roundHalf(unloadClock);
      add(`Товарене — ${hL.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, hL * crew * n(p.workerRate));
      add(`Разтоварване — ${hU.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, hU * crew * n(p.workerRate));
    } else {
      const h = roundHalf(handlingClock);
      add(`Пренасяне и път — ${h.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, h * crew * n(p.workerRate));
    }
  }

  // Нощувка: ако работа + път в ЕДНАТА посока надхвърли прага
  const oneWayDriveH = isCourse && n(p.roadSpeed) ? oneWayKm / n(p.roadSpeed) : 0;
  const nights = isCourse ? Math.max(0, Math.ceil((oneWayDriveH + handlingClock - n(p.overnightThresholdH || 8)) / n(p.dayHours || 10))) : 0;
  if (nights > 0) {
    const sleepers = 1 + (dayCrewMode ? n(p.travelCrew || 1) : 0); // шофьор (+ придружаващ)
    add(`Нощувка — ${nights} ${nights === 1 ? "нощ" : "нощи"} × ${sleepers} ${sleepers === 1 ? "човек" : "души"} × ${n(p.overnightPrice)} ${p.currency}`, nights * sleepers * n(p.overnightPrice));
  }

  // 2) РАЗГЛОБЯВАНЕ/СГЛОБЯВАНЕ — реални часове × хора по демонтажа, квалифициран труд (камионът чака, но не се таксува)
  if (disOnlyManHours) {
    const h = roundHalf(disOnlyHours);
    add(`Разглобяване (${s.pickupHood || s.pickupCity || "товарене"}) — ${h.toFixed(1)} ч × ${disCrew} души × ${disAsmRate} ${p.currency}/ч`, h * disCrew * disAsmRate);
  }
  if (asmOnlyManHours) {
    const h = roundHalf(asmOnlyHours);
    add(`Сглобяване (${s.dropoffHood || s.dropoffCity || "разтоварване"}) — ${h.toFixed(1)} ч × ${asmCrew} души × ${disAsmRate} ${p.currency}/ч`, h * asmCrew * disAsmRate);
  }

  // 3) ОПАКОВАНЕ — човекочаса
  if (wrapManHours + protectManHours) {
    const h = roundHalf(wrapManHours + protectManHours);
    add(`Опаковане — ${h.toFixed(1)} чч × ${n(p.workerRate)} ${p.currency}/ч`, h * n(p.workerRate));
  }

  // 3.5) НОСЕНЕ НА ДЪЛГО РАЗСТОЯНИЕ до/от камиона — реално добавено време, не само такса
  const carryExtraHoursFor = a => {
    const extra = Math.max(0, n(a?.carryDistanceM || 0) - n(p.carryFreeDistanceM || 0));
    if (extra <= 0) return 0;
    return Math.ceil(extra / 10) * n(p.carryExtraMinPer10m || 0) / 60;
  };
  const skipDropoffCarry = isDisposal || selfUnloadMode || usesFieldCrew;
  const carryHoursTot = carryExtraHoursFor(s.pickup) + (skipDropoffCarry ? 0 : carryExtraHoursFor(s.dropoff));
  const carryManHours = carryHoursTot * crew;
  if (carryHoursTot) {
    const h = roundHalf(carryHoursTot);
    add(`Носене на дълго разстояние до камиона — ${h.toFixed(1)} ч × ${crew} души × ${n(p.workerRate)} ${p.currency}/ч`, h * crew * n(p.workerRate));
  }
  const manHours = handlingManHours + disManHours + wrapManHours + protectManHours + fillManHours + carryManHours;
  const clockHours = handlingClock + fillClockElapsed + disHours + carryHoursTot + (crew ? (wrapManHours + protectManHours) / crew : wrapManHours + protectManHours); // общ престой на обекта
  // над 10 часа на ден не се работи — толкова дни реално са нужни за изпълнение
  const workDays = Math.max(1, Math.ceil(clockHours / n(p.dayHours || 10)));

  // спец. обработка
  Object.entries(s.qty).forEach(([id, cnt]) => {
    const it = ITEM_INDEX[id];
    if (it?.surcharge && cnt > 0) add(`${it.label} — спец. обработка ×${cnt}`, it.surcharge * cnt);
  });

  // СТЪЛБИ — парична такса на етаж, на адрес (товарене + разтоварване)
  const boxes = countKind(s.qty, "box") + countKind(s.qty, "sack"); // чувалите се носят като кашони
  const appNormal = countKind(s.qty, "appliance");
  const appHeavy = countKind(s.qty, "appliance_heavy");
  const oversized = countKind(s.qty, "oversized");
  const furniture = countFurniture(s.qty); // обикновени мебели (гардероб, легло, маса...) — без категория
  // стандартни вещи: стълби само при липса на асансьор
  const floorsStd = a => a.floor >= 1 && !a.elevator ? a.floor : 0;
  // едрогабаритни (диван 3-ка и под.): не влизат в пътнически асансьор → стълби, освен при товарен
  const floorsOvr = a => a.floor >= 1 && !(a.elevator && a.elevatorType === "cargo") ? a.floor : 0;
  const perFloorStd = n(p.floorFeeNoElevator) + boxes * n(p.boxPerFloor) + appNormal * n(p.appliancePerFloor) + appHeavy * n(p.heavyAppliancePerFloor) + furniture * n(p.furniturePerFloor);
  const perFloorOvr = oversized * n(p.heavyAppliancePerFloor);
  // при изхвърляне няма адрес на доставка (само сметище); при самостоятелно разтоварване стълбите там са за сметка на клиента
  const skipDropoffFloors = isDisposal || selfUnloadMode || usesFieldCrew;
  const floorsStdTot = floorsStd(s.pickup) + (skipDropoffFloors ? 0 : floorsStd(s.dropoff));
  const floorsOvrTot = floorsOvr(s.pickup) + (skipDropoffFloors ? 0 : floorsOvr(s.dropoff));
  const stairs = floorsStdTot * perFloorStd + floorsOvrTot * perFloorOvr;
  if (stairs) {
    const parts = [];
    if (floorsStdTot && boxes) parts.push(`${boxes} каш.`);
    if (floorsStdTot && appNormal) parts.push(`${appNormal} уред`);
    if (floorsStdTot && appHeavy) parts.push(`${appHeavy} спец.`);
    if (floorsStdTot && furniture) parts.push(`${furniture} мебел`);
    if (floorsOvrTot && oversized) parts.push(`${oversized} едрогаб.`);
    const floorParts = [];
    if (floorsStd(s.pickup)) floorParts.push(`${s.pickupHood || s.pickupCity || "товарене"}: ${floorsStd(s.pickup)} ет.`);
    if (!skipDropoffFloors && floorsStd(s.dropoff)) floorParts.push(`${s.dropoffHood || s.dropoffCity || "разтоварване"}: ${floorsStd(s.dropoff)} ет.`);
    add(`Стълби без асансьор${parts.length ? " · " + parts.join(", ") : ""}${floorParts.length ? " (" + floorParts.join(", ") + ")" : ""}`, stairs);
  }

  // ТРАНСПОРТ (перо) — само за времето, в което камионът реално участва.
  // При "само хамали"/монтаж/ТРД транспортът на стоката не е наш и не се начислява.
  if (usesFieldCrew) {
    // без транспортно перо
  } else if (isDisposal) {
    const totalTruckHours = roundHalf(handlingClock * disposalTrucksN); // сума от часовете на всички камиони
    add(`Транспорт${disposalTrucksN > 1 ? ` (${disposalTrucksN} камиона)` : ""} — ${totalTruckHours.toFixed(1)} ч × ${n(p.truckRate)} ${p.currency}/ч (${totalKm} км до сметището)`, totalTruckHours * n(p.truckRate));
    const fee = n((p.landfillFees || {})[wasteType]);
    if (fee > 0) {
      add(`Такса сметище (${WASTE_LABEL[wasteType]}) — ${trips} курс${trips === 1 ? "" : "а"} × ${fee} ${p.currency}`, trips * fee);
      extraCostTotal += trips * fee;
    }
  } else if (!isCourse) {
    const h = roundHalf(handlingClock);
    add(`Транспорт — ${h.toFixed(1)} ч × ${n(p.truckRate)} ${p.currency}/ч`, h * n(p.truckRate));
  } else {
    const rate = chosen ? chosen.kmRate : n(p.kmRate);
    if (totalKm) add(`Транспорт — ${totalKm} км × ${rate} ${p.currency}/км`, totalKm * rate);
  }

  // материали — реален разход почти на себестойност, приспада се в марж панела по-долу
  if (protectMeters) {
    const fee = protectMeters * n(p.protectPricePerM);
    add(`Велпапе / автопласт — ${protectMeters} м × ${n(p.protectPricePerM)} ${p.currency}/м`, fee, true);
    extraCostTotal += fee;
  }
  if (rolls) {
    const fee = rolls * n(p.stretchRollPrice);
    add(`Стреч фолио — ${wrapMeters} м × ${(n(p.stretchRollPrice) / n(p.stretchRollM || 1)).toFixed(4)} ${p.currency}/м`, fee, true);
    extraCostTotal += fee;
  }

  // отклонение (буфер) — прилага се ПРЕДИ прага за минимум, за да е минималната цена,
  // която въвеждаш в Параметри, наистина минимумът, който клиентът вижда (а не мин×буфер)
  const deviationFactor = n(p.deviationFactor || 1) || 1;
  if (deviationFactor !== 1) {
    const percent = Math.round((deviationFactor - 1) * 100);
    add(`Отклонение (${percent >= 0 ? "+" : ""}${percent}%)`, total * (deviationFactor - 1));
  }

  // праг — след отклонението
  const floor = n(p.minPrice[s.service === "disposal" || usesFieldCrew ? "local" : s.service]);
  if (total < floor) {
    lines.push({
      label: "Изравняване до минимум",
      amount: Math.round(floor - total)
    });
    total = floor;
  }

  // никога не показваме отрицателна (или безсмислена) цена на клиента, независимо от
  // комбинацията параметри (напр. отрицателен коеф. на отклонение)
  total = Math.max(0, total);

  // СЕБЕСТОЙНОСТ И МАРЖ — вътрешни данни (реален разход), не влияят на цената на клиента.
  // Ставката за работник е по градове — тръгва от базата/града, в който реално се работи.
  const costCity = s.service === "intercity" ? s.pickupCity : s.city || null;
  const cityCostEntry = (p.workerCostByCity || []).find(c => normHood(c.city) === normHood(costCity));
  const workerCostRate = n(cityCostEntry ? cityCostEntry.rate : p.workerCostDefault);
  const laborCost = manHours * workerCostRate;
  const truckCostRate = usesFieldCrew ? 0 : n(isCourse || isDisposal ? p.truckCostPerKm : p.truckCostPerHour);
  const truckCostBasis = isCourse || isDisposal ? totalKm : handlingClock;
  const truckCost = usesFieldCrew ? 0 : truckCostBasis * truckCostRate;
  // материали + кола + такса сметище (реален разход, минус за да не изглежда маржа завишен)
  const totalCost = laborCost + truckCost + extraCostTotal;
  const margin = total - totalCost;
  const marginPercent = total > 0 ? margin / total * 100 : 0;
  return {
    total: Math.round(total),
    lines,
    costCity,
    workerCostRate,
    laborCost: Math.round(laborCost),
    truckCost: Math.round(truckCost),
    totalCost: Math.round(totalCost),
    margin: Math.round(margin),
    marginPercent,
    vol,
    weight,
    isDisposal,
    isLabourOnly,
    isManualHoursService,
    usesFieldCrew,
    labourBaseCity,
    labourTravelKm,
    labourAutoBaseCity: labourAutoBase?.city || null,
    wasteType,
    sacks,
    fillManHours,
    tons,
    landfillKm,
    disposalTrucksN,
    disposalTotalCrew,
    payload,
    weightLimited,
    tripsByVol,
    tripsByKg,
    manHours,
    crew,
    clockHours,
    workDays,
    trips,
    cap,
    chosen,
    oneWayKm,
    autoOneWayKm,
    kmManual,
    totalKm,
    driveHours,
    fleet,
    auto: !picked,
    isCourse,
    crewByProtocol,
    autoCrew,
    crewManual,
    reqCrew,
    disHours,
    disManHours,
    disCrew,
    asmCrew,
    disOnlyHours,
    asmOnlyHours,
    disOnlyManHours,
    asmOnlyManHours,
    work,
    wrapMeters,
    wrapHours,
    wrapManHours,
    rolls,
    protectMeters,
    protectManHours,
    handlingClock,
    autoHandlingClock,
    hoursManual,
    handlingManHours,
    loadClock,
    unloadClock,
    travelDays,
    dayCrewMode,
    localCrewMode,
    selfUnloadMode,
    baseCity,
    baseKm,
    baseIsOnRoute,
    needCar,
    nights,
    oneWayDriveH,
    carryHoursTot,
    carryManHours
  };
}

/* ================= ЗАПИС НА КАЛКУЛАЦИИ (база данни) ================= *
 *  Всяка показана калкулация се записва автоматично, дори без контакти.
 *  Ключ: calc:<timestamp>-<rand>. Споделено хранилище → достъпно за Корект.
 * =================================================================== */
const WASTE_LABEL = {
  household: "битов",
  construction: "строителен",
  mixed: "смесен"
};
const CALC_PREFIX = "calc:";

/* --- Устойчив слой над хранилището ---------------------------------
 * Някои среди не позволяват споделено хранилище (или изобщо нямат такова).
 * Опитваме споделено → лично → отказ, и помним кое е проработило.
 * ------------------------------------------------------------------ */
let storageMode = null; // null = непроверено | "shared" | "personal" | "none"
const hasStorage = () => !!(typeof window !== "undefined" && window.storage && typeof window.storage.set === "function");
const modesToTry = () => storageMode && storageMode !== "none" ? [storageMode] : ["shared", "personal"];
const getStorageMode = () => storageMode;
async function storageSet(key, value) {
  if (!hasStorage()) {
    storageMode = "none";
    return false;
  }
  for (const m of modesToTry()) {
    try {
      const res = await window.storage.set(key, value, m === "shared");
      if (res) {
        storageMode = m;
        return true;
      }
    } catch (e) {/* пробваме следващия режим */}
  }
  storageMode = "none";
  return false;
}
async function storageGet(key) {
  if (!hasStorage()) {
    storageMode = "none";
    return null;
  }
  for (const m of modesToTry()) {
    try {
      const res = await window.storage.get(key, m === "shared");
      if (res?.value) {
        storageMode = m;
        return res.value;
      }
    } catch (e) {/* липсващ ключ или недостъпен режим */}
  }
  return null;
}
async function storageList(prefix) {
  if (!hasStorage()) {
    storageMode = "none";
    return [];
  }
  for (const m of modesToTry()) {
    try {
      const res = await window.storage.list(prefix, m === "shared");
      if (res?.keys) {
        storageMode = m;
        return res.keys;
      }
    } catch (e) {/* пробваме следващия режим */}
  }
  return [];
}
const PARAMS_KEY = "config:pricing";
const USER_NAME_KEY = "korekt:userName"; // име на колегата на това устройство — само за отбелязване в записите, не е вход/парола

// чернова на текущата (незавършена) калкулация — за да не се губи при презареждане/затворен таб,
// въпреки надписа "данните се записват автоматично" под формата за заявка
const DRAFT_KEY = "korekt:draft";
const DRAFT_MAX_AGE_MS = 24 * 60 * 60 * 1000; // не възстановяваме чернова, по-стара от денонощие
function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return null;
    if (!parsed.savedAt || Date.now() - parsed.savedAt > DRAFT_MAX_AGE_MS) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}
function saveDraftLS(step, s, recordKey, recordNumber, pushed) {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      step,
      s,
      recordKey,
      recordNumber,
      pushed,
      savedAt: Date.now()
    }));
  } catch (e) {/* без значение — просто няма да се възстанови */}
}
function clearDraftLS() {
  try {
    localStorage.removeItem(DRAFT_KEY);
  } catch (e) {/* без значение */}
}

// --- Достъп до вътрешните панели (Записи / Параметри / Марж) ---------------
// ВНИМАНИЕ: това е само ключалка на ВРАТАТА на UI — спира случаен посетител
// от едно кликване. НЕ е истинска сигурност: паролата стои в изходния код
// на страницата (вижда се от всеки, който отвори DevTools), а Supabase anon
// ключът в DEFAULTS остава публичен и позволява директно четене на таблицата
// през REST API, независимо от тази ключалка. За истинска защита на личните
// данни на клиентите трябва Supabase Auth + RLS политика, ограничаваща SELECT
// само до логнати (автентикирани) потребители — виж бележката в README/паметта.
const ADMIN_PASSWORD = "korekt-tim-2026"; // смени по всяко време — просто текст тук
const ADMIN_UNLOCK_KEY = "korekt:adminUnlocked";

// "" (изпразнено поле по средата на писане) не бива да замести число трайно —
// пази стойността по подразбиране, докато не дойде истинско ново число
function sanitizeNumericParams(obj, defaults) {
  const out = {
    ...obj
  };
  for (const key of Object.keys(defaults)) {
    const dv = defaults[key],
      v = out[key];
    if (typeof dv === "number") {
      if (v === "" || v == null || !Number.isFinite(Number(v))) out[key] = dv;
    } else if (dv && typeof dv === "object" && !Array.isArray(dv) && v && typeof v === "object" && !Array.isArray(v)) {
      out[key] = sanitizeNumericParams(v, dv);
    }
  }
